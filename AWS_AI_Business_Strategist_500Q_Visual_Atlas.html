"><div class=\"note-marker\"><\/div><h3>10–17: Responsible practice<\/h3><ul><li>Classify data sensitivity and decision consequences.<\/li><li>Use lawful, proportionate data processing.<\/li><li>Evaluate fairness across relevant groups.<\/li><li>Provide explainability where the decision demands it.<\/li><li>Make human oversight meaningful.<\/li><li>Restrict agent tool permissions.<\/li><li>Treat retrieved content as untrusted.<\/li><li>Record decisions and rehearse incident response.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>18–25: Transformation<\/h3><ul><li>Assess AWS CAF six perspectives.<\/li><li>Appoint visible executive sponsorship.<\/li><li>Map frontline stakeholders and workflows.<\/li><li>Upskill or reskill based on future roles.<\/li><li>Integrate AI into real systems and processes.<\/li><li>Monitor quality, value and risk after launch.<\/li><li>Manage vendors, lock-in and exit.<\/li><li>Stop programmes that do not meet business or safety thresholds.<\/li><\/ul><\/section>"},{"d":5,"title":"Seven-day exam preparation route","sub":"Combine notes, application and timed practice","shape":"gates","nodes":["D1 concepts","D2 finance","D3 risk","D4 change","Full mock"],"blocks":[["Days 1–2",["Day 1: AI terminology, AI versus automation, model types, prompts, RAG, fine-tuning and agents.","Day 2: AI value discovery, KPI baselines, financial logic, TCO, build/buy/partner, pilots and portfolio choices."]],["Days 3–4",["Day 3: Responsible AI principles, fairness, privacy, vendor governance, risk register, oversight and incidents.","Day 4: AWS CAF, workforce readiness, data governance, change management and scale."]],["Days 5–7",["Day 5: Mixed 50-question practice, then explanations for every incorrect or guessed answer.","Day 6: Timed 85-question simulation; analyze domain weaknesses.","Day 7: Review weak concepts, retest missed questions, and run a final timed mock."]],["Suggested readiness signal",["Aim for repeatable strong results on unseen scenario sets, not a single memorized score.","The tool cannot convert your practice percentage into the AWS scaled pass score."]]],"trap":"Official AWS resources and practice questions should complement this independently authored bank.","question":"Can you justify the best answer without seeing the options?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Days 1–2<\/h3><ul><li><strong>Day 1:<\/strong> AI terminology, AI versus automation, model types, prompts, RAG, fine-tuning and agents.<\/li><li><strong>Day 2:<\/strong> AI value discovery, KPI baselines, financial logic, TCO, build/buy/partner, pilots and portfolio choices.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Days 3–4<\/h3><ul><li><strong>Day 3:<\/strong> Responsible AI principles, fairness, privacy, vendor governance, risk register, oversight and incidents.<\/li><li><strong>Day 4:<\/strong> AWS CAF, workforce readiness, data governance, change management and scale.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Days 5–7<\/h3><ul><li><strong>Day 5:<\/strong> Mixed 50-question practice, then explanations for every incorrect or guessed answer.<\/li><li><strong>Day 6:<\/strong> Timed 85-question simulation; analyze domain weaknesses.<\/li><li><strong>Day 7:<\/strong> Review weak concepts, retest missed questions, and run a final timed mock.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Suggested readiness signal<\/h3><ul><li>Aim for repeatable strong results on unseen scenario sets, not a single memorized score.<\/li><li>The tool cannot convert your practice percentage into the AWS scaled pass score.<\/li><\/ul><\/section>"}],"questions":[{"id":"Q001","d":1,"type":"Definition","stem":"Which term BEST matches this definition? Technology that performs tasks associated with human reasoning, perception, or decision-making.","options":["Artificial intelligence","Supervised learning","Recommendation system","Natural language processing"],"answer":[0],"explanation":"Artificial intelligence: Technology that performs tasks associated with human reasoning, perception, or decision-making.","tag":"Artificial intelligence"},{"id":"Q002","d":1,"type":"Applied concept","stem":"A business team reports the following situation: An insurer uses software to interpret customer inquiries and route complex cases to specialists. Which concept is MOST directly illustrated?","options":["Recommendation system","Computer vision","Artificial intelligence","Regression"],"answer":[2],"explanation":"This is an example of artificial intelligence. Technology that performs tasks associated with human reasoning, perception, or decision-making.","tag":"Artificial intelligence"},{"id":"Q003","d":1,"type":"Definition","stem":"Which term BEST matches this definition? A branch of AI that learns statistical patterns from data instead of relying only on explicitly coded rules.","options":["Machine learning","Fine-tuning","Prompt engineering","Artificial intelligence"],"answer":[0],"explanation":"Machine learning: A branch of AI that learns statistical patterns from data instead of relying only on explicitly coded rules.","tag":"Machine learning"},{"id":"Q004","d":1,"type":"Applied concept","stem":"A business team reports the following situation: A retailer improves demand forecasts by learning from several years of sales patterns. Which concept is MOST directly illustrated?","options":["Recommendation system","Machine learning","Foundation model","Large language model"],"answer":[1],"explanation":"This is an example of machine learning. A branch of AI that learns statistical patterns from data instead of relying only on explicitly coded rules.","tag":"Machine learning"},{"id":"Q005","d":1,"type":"Definition","stem":"Which term BEST matches this definition? Model learning based on examples paired with known labels or target outcomes.","options":["Supervised learning","Model drift","Unsupervised learning","Machine learning"],"answer":[0],"explanation":"Supervised learning: Model learning based on examples paired with known labels or target outcomes.","tag":"Supervised learning"},{"id":"Q006","d":1,"type":"Applied concept","stem":"A business team reports the following situation: A bank trains a classifier using historic transactions already labelled fraudulent or legitimate. Which concept is MOST directly illustrated?","options":["Machine learning","Classification","Supervised learning","Prompt engineering"],"answer":[2],"explanation":"This is an example of supervised learning. Model learning based on examples paired with known labels or target outcomes.","tag":"Supervised learning"},{"id":"Q007","d":1,"type":"Definition","stem":"Which term BEST matches this definition? Finding hidden structure or groups in data without predefined target labels.","options":["Hallucination","Model drift","Unsupervised learning","Machine learning"],"answer":[2],"explanation":"Unsupervised learning: Finding hidden structure or groups in data without predefined target labels.","tag":"Unsupervised learning"},{"id":"Q008","d":1,"type":"Applied concept","stem":"A business team reports the following situation: A telecommunications company groups subscribers by similar usage behaviour without preassigned segments. Which concept is MOST directly illustrated?","options":["Unsupervised learning","Supervised learning","Regression","Hallucination"],"answer":[0],"explanation":"This is an example of unsupervised learning. Finding hidden structure or groups in data without predefined target labels.","tag":"Unsupervised learning"},{"id":"Q009","d":1,"type":"Definition","stem":"Which term BEST matches this definition? Learning through feedback or rewards from actions taken in an environment.","options":["Large language model","Fine-tuning","Reinforcement learning","Inference"],"answer":[2],"explanation":"Reinforcement learning: Learning through feedback or rewards from actions taken in an environment.","tag":"Reinforcement learning"},{"id":"Q010","d":1,"type":"Applied concept","stem":"A business team reports the following situation: A simulator rewards a scheduling agent for minimizing delays over repeated trials. Which concept is MOST directly illustrated?","options":["Artificial intelligence","Hallucination","Reinforcement learning","Retrieval-augmented generation (RAG)"],"answer":[2],"explanation":"This is an example of reinforcement learning. Learning through feedback or rewards from actions taken in an environment.","tag":"Reinforcement learning"},{"id":"Q011","d":1,"type":"Definition","stem":"Which term BEST matches this definition? AI that creates new content such as text, images, audio, code, or summaries.","options":["Generative AI","Training","Supervised learning","Fine-tuning"],"answer":[0],"explanation":"Generative AI: AI that creates new content such as text, images, audio, code, or summaries.","tag":"Generative AI"},{"id":"Q012","d":1,"type":"Applied concept","stem":"A business team reports the following situation: A marketing team drafts tailored product descriptions from approved product specifications. Which concept is MOST directly illustrated?","options":["Generative AI","Computer vision","Large language model","Retrieval-augmented generation (RAG)"],"answer":[0],"explanation":"This is an example of generative ai. AI that creates new content such as text, images, audio, code, or summaries.","tag":"Generative AI"},{"id":"Q013","d":1,"type":"Definition","stem":"Which term BEST matches this definition? A broadly pretrained model that can be adapted to many downstream tasks.","options":["Foundation model","Supervised learning","Recommendation system","Natural language processing"],"answer":[0],"explanation":"Foundation model: A broadly pretrained model that can be adapted to many downstream tasks.","tag":"Foundation model"},{"id":"Q014","d":1,"type":"Applied concept","stem":"A business team reports the following situation: A company evaluates one general language model for summarization, search assistance, and drafting. Which concept is MOST directly illustrated?","options":["Artificial intelligence","Fine-tuning","Foundation model","Machine learning"],"answer":[2],"explanation":"This is an example of foundation model. A broadly pretrained model that can be adapted to many downstream tasks.","tag":"Foundation model"},{"id":"Q015","d":1,"type":"Definition","stem":"Which term BEST matches this definition? A model trained on language patterns to process and generate text.","options":["Foundation model","Large language model","Artificial intelligence","Machine learning"],"answer":[1],"explanation":"Large language model: A model trained on language patterns to process and generate text.","tag":"Large language model"},{"id":"Q016","d":1,"type":"Applied concept","stem":"A business team reports the following situation: A support assistant translates and summarizes multilingual customer messages. Which concept is MOST directly illustrated?","options":["Machine learning","Model drift","Large language model","Fine-tuning"],"answer":[2],"explanation":"This is an example of large language model. A model trained on language patterns to process and generate text.","tag":"Large language model"},{"id":"Q017","d":1,"type":"Definition","stem":"Which term BEST matches this definition? Computational techniques that interpret, extract meaning from, or generate human language.","options":["Model drift","Hallucination","Natural language processing","Reinforcement learning"],"answer":[2],"explanation":"Natural language processing: Computational techniques that interpret, extract meaning from, or generate human language.","tag":"Natural language processing"},{"id":"Q018","d":1,"type":"Applied concept","stem":"A business team reports the following situation: A contact center analyzes sentiment in written customer complaints. Which concept is MOST directly illustrated?","options":["Artificial intelligence","Retrieval-augmented generation (RAG)","Inference","Natural language processing"],"answer":[3],"explanation":"This is an example of natural language processing. Computational techniques that interpret, extract meaning from, or generate human language.","tag":"Natural language processing"},{"id":"Q019","d":1,"type":"Definition","stem":"Which term BEST matches this definition? Techniques that extract useful information from images or video.","options":["Computer vision","Artificial intelligence","Regression","Reinforcement learning"],"answer":[0],"explanation":"Computer vision: Techniques that extract useful information from images or video.","tag":"Computer vision"},{"id":"Q020","d":1,"type":"Applied concept","stem":"A business team reports the following situation: A manufacturer uses camera footage to detect damaged packaging. Which concept is MOST directly illustrated?","options":["Computer vision","Retrieval-augmented generation (RAG)","Machine learning","Large language model"],"answer":[0],"explanation":"This is an example of computer vision. Techniques that extract useful information from images or video.","tag":"Computer vision"},{"id":"Q021","d":1,"type":"Definition","stem":"Which term BEST matches this definition? Predicting which discrete category an observation belongs to.","options":["Unsupervised learning","Classification","Recommendation system","Fine-tuning"],"answer":[1],"explanation":"Classification: Predicting which discrete category an observation belongs to.","tag":"Classification"},{"id":"Q022","d":1,"type":"Applied concept","stem":"A business team reports the following situation: A claims system labels submissions as low, medium, or high review priority. Which concept is MOST directly illustrated?","options":["Foundation model","Inference","Retrieval-augmented generation (RAG)","Classification"],"answer":[3],"explanation":"This is an example of classification. Predicting which discrete category an obs ayback arithmetic"},{"id":"Q323","d":2,"type":"Scenario risk","stem":"Payback arithmetic: A workflow costs $240,000 initially and produces $10,000 monthly net savings after ongoing costs. Which risk is MOST DIRECTLY exposed if the team ignores the main concern?","options":["Misrouted urgent support requests can harm customers","Gross rather than net savings can understate recovery time","Vanity metrics can hide a lack of real impact","Demo performance may not generalize to real use"],"answer":[1],"explanation":"Primary risk: Gross rather than net savings can understate recovery time. Simple payback equals 240000 divided by 10000 months.","tag":"Payback arithmetic"},{"id":"Q324","d":2,"type":"Multi-select","stem":"Payback arithmetic: A workflow costs $240,000 initially and produces $10,000 monthly net savings after ongoing costs. Which TWO actions would MOST directly strengthen the recommended approach? (Select 2.)","options":["Avoid comparison to the current non-AI process","Exclude recurring operating costs from the financial case","Leave business benefit ownership undefined","Check that the monthly benefit is net of running costs","Document whether discounting is excluded from simple payback"],"answer":[3,4],"explanation":"Recommended safeguards: Check that the monthly benefit is net of running costs; Document whether discounting is excluded from simple payback. Simple payback equals 240000 divided by 10000 months.","tag":"Payback arithmetic"},{"id":"Q325","d":2,"type":"Scenario","stem":"Unit economics arithmetic: A service team pays $0.80 for AI processing and $0.40 for human checks per case, compared with $2.00 currently. What should the business strategist recommend as the BEST next approach?","options":["Estimate savings of $0.80 per case, before other shared overhead and fixed costs.","Use the number of prompts sent as the sole business success criterion","Claim all employee minutes saved are immediate cash savings","Prefer the most fashionable AI tool despit s: Agree production requirements with operations teams; Fund monitoring and ongoing support before launch; Set explicit readiness and business-value criteria for the next rollout stage. Operationalization is a separate capability from demonstrating technical feasibility.","tag":"Stalled proof of concept"},{"id":"Q477","d":4,"type":"Scenario","stem":"Data access bottlenecks: An AI initiative is delayed because business units disagree about access to records. What should the business strategist recommend as the BEST next approach?","options":["Establish data stewardship, approved access processes, and shared definitions.","Skip staff consultation and training to improve launch speed","Treat login counts as the only evidence of successful change","Launch enterprise-wide before resolving pilot or workforce concerns"],"answer":[0],"explanation":"Data governance enables safe and repeatable access for transformation.","tag":"Data access bottlenecks"},{"id":"Q478","d":4,"type":"Business KPI","stem":"Data access bottlenecks: An AI initiative is delayed because business units disagree about access to records. Which measure MOST DIRECTLY tests whether this particular initiative is succeeding?","options":["Number of presentation slides about the initiative","End-to-end productivity and quality improvement among target users","Cycle time for lawful data-access decisions","Value delivered per roadmap stage against constraints"],"answer":[2],"explanation":"A suitable outcome indicator is: Cycle time for lawful data-access decisions. Data governance enables safe and repeatable access for transformation.","tag":"Data access bottlenecks"},{"id":"Q479","d":4,"type":"Scenario risk","stem":"Data access bottlenecks: An AI initiative is delayed because business units disagree about access to records. Which risk is MOST DIRECTLY exposed if the team ignores the main concern?","options":["Unclear stewardship can block delivery and weaken compliance","Neglecting human review can exaggerate pe ications"},{"id":"Q488","d":4,"type":"Multi-select","stem":"Transformation communications: A company launches a new AI workflow with only an email announcing the go-live date. Which THREE actions would MOST directly strengthen the recommended approach? (Select 3.)","options":["Tailor communications to specific roles","Begin rollout with no operational fallback","Offer feedback and support after launch","Let pilot success substitute for operational support planning","Disregard different site workflows","Set explicit readiness and business-value criteria for the next rollout stage"],"answer":[0,2,5],"explanation":"Recommended safeguards: Tailor communications to specific roles; Offer feedback and support after launch; Set explicit readiness and business-value criteria for the next rollout stage. Change management must explain why, how, and what's different for each audience.","tag":"Transformation communications"},{"id":"Q489","d":4,"type":"Scenario","stem":"Supplier knowledge dependence: A consultant delivers an AI pilot, but no internal employee understands its operation or risks. What should the business strategist recommend as the BEST next approach?","options":["Launch enterprise-wide before resolving pilot or workforce concerns","Assume one successful pilot proves every site is ready","Delegate all business benefit accountability to the engineering team","Include knowledge transfer, documentation, and internal ownership before accepting handover."],"answer":[3],"explanation":"Partner support should build lasting organizational capability.","tag":"Supplier knowledge dependence"},{"id":"Q490","d":4,"type":"Business KPI","stem":"Supplier knowledge dependence: A consultant delivers an AI pilot, but no internal employee understands its operation or risks. Which measure MOST DIRECTLY tests whether this particular initiative is succeeding?","options":["Percentage of affected employees successfully transitioned to defined roles","Percentage of key operational tasks independently handled by internal teams","Reduction in end-to-end workflow completion time","Number of presentation slides about the initiative"],"answer":[1],"explanation":"A suitable outcome indicator is: Percentage of key operational tasks independently handled by internal teams. Partner support should build lasting organizational capability.","tag":"Supplier knowledge dependence"},{"id":"Q491","d":4,"type":"Scenario risk","stem":"Supplier knowledge dependence: A consultant delivers an AI pilot, but no internal employee understands its operation or risks. Which risk is MOST DIRECTLY exposed if the team ignores the main concern?","options":["Vendor lock-in can leave the organization unable to maintain benefits","Unverified self-reported hours can inflate financial ROI","Leadership may miss cumulative enterprise exposure","Activity counts can rise while service quality falls"],"answer":[0],"explanation":"Primary risk: Vendor lock-in can leave the organization unable to maintain benefits. Partner support should build lasting organizational capability.","tag":"Supplier knowledge dependence"},{"id":"Q492","d":4,"type":"Multi-select","stem":"Supplier knowledge dependence: A consultant delivers an AI pilot, but no internal employee understands its operation or risks. Which TWO actions would MOST directly strengthen the recommended approach? (Select 2.)","options":["Treat executive enthusiasm as evidence of adoption","Assign internal service and risk owners","Disregard different site workflows","Let pilot success substitute for operational support planning","Require runbooks and training during delivery"],"answer":[1,4],"explanation":"Recommended safeguards: Require runbooks and training during delivery; Assign internal service and risk owners. Partner support should build lasting organizational capability.","tag":"Supplier knowledge dependence"},{"id":"Q493","d":4,"type":"Scenario","stem":"Benefits at scale: A small pilot shows a 30% time reduction, but full rollout would create new review and support work. What should the business strategist recommend as the BEST next approach?","options":["Leave data ownership and approval responsibilities unspecified","Launch enterprise-wide before resolving pilot or workforce concerns","Revalidate end-to-end benefits and costs using production-scale operating assumptions.","Assume one successful pilot proves every site is ready"],"answer":[2],"explanation":"Headline pilot productivity gains are not guaranteed enterprise savings.","tag":"Benefits at scale"},{"id":"Q494","d":4,"type":"Business KPI","stem":"Benefits at scale: A small pilot shows a 30% time reduction, but full rollout would create new review and support work. Which measure MOST DIRECTLY tests whether this particular initiative is succeeding?","options":["Share of initiatives with owners, comparable KPIs, and decisions","Net time or cost saved after oversight and support effort","Realized benefit against agreed operational targets","Number of presentation slides about the initiative"],"answer":[1],"explanation":"A suitable outcome indicator is: Net time or cost saved after oversight and support effort. Headline pilot productivity gains are not guaranteed enterprise savings.","tag":"Benefits at scale"},{"id":"Q495","d":4,"type":"Scenario risk","stem":"Benefits at scale: A small pilot shows a 30% time reduction, but full rollout would create new review and support work. Which risk is MOST DIRECTLY exposed if the team ignores the main concern?","options":["Misrouted urgent support requests can harm customers","Scaling can dilute gains through additional review and overhead","Nominal sign-off may fail to catch harmful recommendations","Building bespoke systems can delay value without differentiation"],"answer":[1],"explanation":"Primary risk: Scaling can dilute gains through additional review and overhead. Headline pilot productivity gains are not guaranteed enterprise savings.","tag":"Benefits at scale"},{"id":"Q496","d":4,"type":"Multi-select","stem":"Benefits at scale: A small pilot shows a 30% time reduction, but full rollout would create new review and support work. Which TWO actions would MOST directly strengthen the recommended approach? (Select 2.)","options":["Treat executive enthusiasm as evidence of adoption","Begin rollout with no operational fallback","Let pilot success substitute for operational support planning","Run a staged production validation","Estimate new support and compliance workload"],"answer":[3,4],"explanation":"Recommended safeguards: Estimate new support and compliance workload; Run a staged production validation. Headline pilot productivity gains are not guaranteed enterprise savings.","tag":"Benefits at scale"},{"id":"Q497","d":4,"type":"Scenario","stem":"AI programme roadmap: An executive wants all proposed use cases funded during the same quarter. What should the business strategist recommend as the BEST next approach?","options":["Leave data ownership and approval responsibilities unspecified","Launch enterprise-wide before resolving pilot or workforce concerns","Sequence the roadmap by value, dependencies, capacity, and risk.","Treat login counts as the only evidence of successful change"],"answer":[2],"explanation":"Roadmaps should reflect capability and capacity constraints, not just demand.","tag":"AI programme roadmap"},{"id":"Q498","d":4,"type":"Business KPI","stem":"AI programme roadmap: An executive wants all proposed use cases funded during the same quarter. Which measure MOST DIRECTLY tests whether this particular initiative is succeeding?","options":["Value delivered per roadmap stage against constraints","Share of initiatives with owners, comparable KPIs, and decisions","Pilot-to-production conversion meeting quality and value gates","Number of presentation slides about the initiative"],"answer":[0],"explanation":"A suitable outcome indicator is: Value delivered per roadmap stage against constraints. Roadmaps should reflect capability and capacity constraints, not just demand.","tag":"AI programme roadmap"},{"id":"Q499","d":4,"type":"Scenario risk","stem":"AI programme roadmap: An executive wants all proposed use cases funded during the same quarter. Which risk is MOST DIRECTLY exposed if the team ignores the main concern?","options":["Overloading teams can increase delays and failure rates","Fabricated policy provisions may lead to noncompliant decisions","False statements could mislead investors and create liability","A low visible price may conceal lock-in and compliance costs"],"answer":[0],"explanation":"Primary risk: Overloading teams can increase delays and failure rates. Roadmaps should reflect capability and capacity constraints, not just demand.","tag":"AI programme roadmap"},{"id":"Q500","d":4,"type":"Multi-select","stem":"AI programme roadmap: An executive wants all proposed use cases funded during the same quarter. Which THREE actions would MOST directly strengthen the recommended approach? (Select 3.)","options":["Omit training and role transition planning","Set explicit readiness and business-value criteria for the next rollout stage","Begin rollout with no operational fallback","Map shared data and skills dependencies","Keep frontline representatives out of project reviews","Assign stage-gates and accountable owners"],"answer":[1,3,5],"explanation":"Recommended safeguards: Map shared data and skills dependencies; Assign stage-gates and accountable owners; Set explicit readiness and business-value criteria for the next rollout stage. Roadmaps should reflect capability and capacity constraints, not just demand.","tag":"AI programme roadmap"}],"terms":[{"d":1,"term":"Artificial intelligence","definition":"Technology that performs tasks associated with human reasoning, perception, or decision-making.","example":"An insurer uses software to interpret customer inquiries and route complex cases to specialists."},{"d":1,"term":"Machine learning","definition":"A branch of AI that learns statistical patterns from data instead of relying only on explicitly coded rules.","example":"A retailer improves demand forecasts by learning from several years of sales patterns."},{"d":1,"term":"Supervised learning","definition":"Model learning based on examples paired with known labels or target outcomes.","example":"A bank trains a classifier using historic transactions already labelled fraudulent or legitimate."},{"d":1,"term":"Unsupervised learning","definition":"Finding hidden structure or groups in data without predefined target labels.","example":"A telecommunications company groups subscribers by similar usage behaviour without preassigned segments."},{"d":1,"term":"Reinforcement learning","definition":"Learning through feedback or rewards from actions taken in an environment.","example":"A simulator rewards a scheduling agent for minimizing delays over repeated trials."},{"d":1,"term":"Generative AI","definition":"AI that creates new content such as text, images, audio, code, or summaries.","example":"A marketing team drafts tailored product descriptions from approved product specifications."},{"d":1,"term":"Foundation model","definition":"A broadly pretrained model that can be adapted to many downstream tasks.","example":"A company evaluates one general language model for summarization, search assistance, and drafting."},{"d":1,"term":"Large language model","definition":"A model trained on language patterns to process and generate text.","example":"A support assistant translates and summarizes multilingual customer messages."},{"d":1,"term":"Natural language processing","definition":"Computational techniques that interpret, extract meaning from, or generate human language.","example":"A contact center analyzes sentiment in written customer complaints."},{"d":1,"term":"Computer vision","definition":"Techniques that extract useful information from images or video.","example":"A manufacturer uses camera footage to detect damaged packaging."},{"d":1,"term":"Classification","definition":"Predicting which discrete category an observation belongs to.","example":"A claims system labels submissions as low, medium, or high review priority."},{"d":1,"term":"Regression","definition":"Predicting a continuous numeric quantity.","example":"A logistics company forecasts delivery time in minutes."},{"d":1,"term":"Recommendation system","definition":"A system that ranks products or content likely to be relevant to a user.","example":"A shopping platform suggests items based on browsing behaviour and consented preferences."},{"d":1,"term":"Inference","definition":"Running a trained model on new inputs to obtain predictions or generated outputs.","example":"An existing model assesses a new customer review without retraining itself."},{"d":1,"term":"Training","definition":"The process of adjusting a model using examples and an optimization objective.","example":"A data science team updates a model using an approved historical dataset."},{"d":1,"term":"Prompt engineering","definition":"Designing instructions, structure, examples, and context to guide model responses.","example":"A project manager specifies the audience, format, source limits, and tone in an AI instruction."},{"d":1,"term":"Retrieval-augmented generation (RAG)","definition":"A technique that retrieves relevant external information and supplies it to a model at response time.","example":"An HR assistant answers using current policies from an indexed internal knowledge base."},{"d":1,"term":"Fine-tuning","definition":"Additional training that adapts a pretrained model's response behaviour using a task-specific dataset.","example":"A firm adapts a general model to produce specialist report structures consistently."},{"d":1,"term":"Hallucination","definition":"AI-generated content that is plausible but false, unsupported, or fabricated.","example":"An assistant invents a nonexistent clause in a corporate policy."},{"d":1,"term":"Model drift","definition":"Deterioration or change in model performance as data or operating conditions change.","example":"A seasonal demand model becomes less accurate after customers adopt new buying patterns."},{"d":2,"term":"Business objective alignment","definition":"Linking a proposed AI initiative to a measurable organizational goal.","example":"A board will fund a copilot only if it demonstrably improves customer retention."},{"d":2,"term":"Baseline metric","definition":"A measurement of performance before an initiative begins, used for comparison.","example":"A company measures current call resolution time before introducing an assistant."},{"d":2,"term":"Key performance indicator (KPI)","definition":"A measurable signal used to track progress toward a business objective.","example":"A service leader tracks first-contact resolution rather than chatbot message volume."},{"d":2,"term":"Return on investment (ROI)","definition":"A financial measure comparing net benefits with the investment required.","example":"A CFO compares savings and incremental revenue with full AI deployment costs."},{"d":2,"term":"Total cost of ownership (TCO)","definition":"The full lifecycle cost of a solution, including operation, integration, maintenance, and controls.","example":"A procurement review counts training, monitoring, and vendor fees beyond initial licensing."},{"d":2,"term":"Net present value (NPV)","definition":"The present value of future net cash flows after discounting, less the initial investment.","example":"A finance team discounts expected multiyear automation savings before approving a programme."},{"d":2,"term":"Payback period","definition":"The time required for cumulative benefits to recover the initial investment.","example":"A sponsor asks how many months of savings are needed to recover launch spending."},{"d":2,"term":"Opportunity prioritization","definition":"Ranking AI candidates by business value, feasibility, risk, and readiness.","example":"A steering group selects a low-risk high-value workflow ahead of an impressive unproven agent."},{"d":2,"term":"Build versus buy versus partner","definition":"Deciding whether to develop internally, procure a solution, or collaborate with a specialist.","example":"A small firm compares a packaged assistant with custom development and a managed provider."},{"d":2,"term":"Proof of concept","definition":"A limited technical test to determine whether an idea is feasible.","example":"A team tests whether a model can extract fields from a sample of contracts before investment."},{"d":2,"term":"Pilot","definition":"A constrained real-world deployment intended to validate outcomes and operating assumptions.","example":"A hospital tests an assistant in one administrative department using agreed acceptance criteria."},{"d":2,"term":"Minimum viable product (MVP)","definition":"The smallest usable version of a product that delivers and tests core value.","example":"A sales team launches only one AI-enabled proposal workflow before adding more features."},{"d":2,"term":"Cost-benefit analysis","definition":"Comparing expected tangible and intangible benefits against all material costs.","example":"A council evaluates both reduced processing time and citizen satisfaction against operational expense."},{"d":2,"term":"Risk-adjusted value","definition":"Expected benefit considered alongside uncertainty, potential losses, and mitigating controls.","example":"Two AI options have equal projected savings but different exposure to regulatory penalties."},{"d":2,"term":"Value realization","definition":"Measuring whether promised benefits are actually achieved after implementation.","example":"A sponsor reviews post-launch outcomes against the savings committed in the business case."},{"d":2,"term":"Competitive differentiation","definition":"A capability that helps a business stand out in ways customers value.","example":"A tour operator uses localized personalized trip design to create a distinctive service."},{"d":2,"term":"Unit economics","definition":"Revenue, cost, and contribution measured per transaction, user, or other unit.","example":"A provider compares AI cost per resolved case with current agent cost per case."},{"d":2,"term":"Sensitivity analysis","definition":"Testing how a business case changes when uncertain assumptions vary.","example":"Finance examines whether ROI stays positive when volume halves or AI usage cost doubles."},{"d":2,"term":"Scenario planning","definition":"Evaluating plausible future business conditions before making a commitment.","example":"A retailer models low, medium, and high adoption paths before signing a contract."},{"d":2,"term":"Opportunity cost","definition":"The value of the best alternative forgone when resources are committed to one choice.","example":"A portfolio board considers which customer project would lose funding if it approved an AI pilot."},{"d":3,"term":"Responsible AI","definition":"Developing and using AI with attention to fairness, safety, transparency, privacy, and accountability.","example":"A bank establishes oversight before introducing automated credit support."},{"d":3,"term":"Fairness","definition":"Seeking to avoid unjustified disparate effects on people or groups.","example":"A hiring pilot compares screening outcomes across legally relevant demographic groups."},{"d":3,"term":"Explainability","definition":"Making model behaviour or influential factors understandable to relevant stakeholders.","example":"A clinician needs a meaningful explanation of a clinical decision-support suggestion."},{"d":3,"term":"Transparency","definition":"Clearly communicating when AI is used and relevant limitations or processes.","example":"A contact center tells customers when they are interacting with an AI assistant."},{"d":3,"term":"Human oversight","definition":"Meaningful human ability to review, intervene, or override AI recommendations.","example":"A loan officer reviews flagged high-stakes decisions before final approval."},{"d":3,"term":"Accountability","definition":"Explicit assignment of ownership for AI decisions, controls, and outcomes.","example":"A named executive is answerable for the risk controls on an AI product."},{"d":3,"term":"Data privacy","definition":"Protecting personal data and respecting lawful purposes, collection, and usage restrictions.","example":"A hospital prevents patient details from being sent to an unapproved AI tool."},{"d":3,"term":"Data minimization","definition":"Using only the personal information reasonably needed for a legitimate purpose.","example":"A customer chatbot avoids collecting birth dates when an order number is sufficient."},{"d":3,"term":"Consent and lawful basis","definition":"Ensuring personal-data use is supported by an appropriate legal basis and applicable notices.","example":"A marketing team verifies permission and applicable lawful basis before profiling customers."},{"d":3,"term":"Data residency","definition":"Requirements or preferences about where data is stored or processed geographically.","example":"A multinational checks processing-location restrictions before approving a vendor."},{"d":3,"term":"Bias testing","definition":"Evaluating whether performance or outcomes vary in ways that create unfair impacts.","example":"An insurer checks whether a model systematically disadvantages certain applicant segments."},{"d":3,"term":"Risk register","definition":"A maintained record of risks, owners, likelihood, impact, mitigations, and status.","example":"An AI steering committee reviews outstanding privacy and security risks monthly."},{"d":3,"term":"Model card","definition":"A structured summary of a model's intended uses, limitations, evaluation and relevant considerations.","example":"A procurement team reviews documented evaluation limitations before adoption."},{"d":3,"term":"Audit trail","definition":"Records enabling decisions, changes, and access to be reconstructed and reviewed.","example":"An enterprise logs AI recommendations and human approvals for later investigation."},{"d":3,"term":"Guardrails","definition":"Controls that constrain inappropriate inputs, outputs, or behaviours of AI systems.","example":"A public assistant blocks disallowed content and escalation-triggering responses."},{"d":3,"term":"Prompt injection","definition":"Malicious instructions embedded in input or retrieved content that try to redirect model behaviour.","example":"A retrieved document tells an AI agent to ignore previous policies and leak a secret."},{"d":3,"term":"Shadow AI","definition":"Use of AI systems without organizational approval or governance.","example":"Employees paste sensitive contracts into a consumer chatbot without authorization."},{"d":3,"term":"Shared responsibility","definition":"The principle that the cloud provider and customer have distinct security and compliance obligations.","example":"A customer assumes the cloud vendor alone is responsible for authorizing employee access."},{"d":3,"term":"Third-party risk management","definition":"Assessing and monitoring risks arising from vendors and external technology partners.","example":"A procurement team requests supplier retention policies and audit commitments."},{"d":3,"term":"Incident response","definition":"A planned process to detect, contain, investigate, communicate, and learn from adverse events.","example":"A deployed assistant discloses restricted content and the organization activates a response plan."},{"d":4,"term":"AI readiness assessment","definition":"A structured review of whether people, data, technology, processes, and governance can support AI.","example":"A company evaluates skills and data quality before funding an enterprise rollout."},{"d":4,"term":"AI maturity","definition":"How systematically and effectively an organization uses, manages, and improves AI capabilities.","example":"A business moves from isolated experiments to governed, measured AI programmes."},{"d":4,"term":"Executive sponsorship","definition":"Visible senior leadership commitment that secures funding, direction, and accountability.","example":"A chief operating officer champions a cross-functional AI transformation programme."},{"d":4,"term":"Change management","definition":"Structured actions to prepare, support, and sustain people through new ways of working.","example":"A department trains staff and updates workflows before switching to AI-supported operations."},{"d":4,"term":"Stakeholder mapping","definition":"Identifying people affected by an initiative and their needs, influence, or concerns.","example":"A sponsor identifies frontline agents, security staff, unions, and customers before a rollout."},{"d":4,"term":"Skills-gap assessment","definition":"Comparing available workforce capabilities with those required by a future operating model.","example":"An HR team identifies roles needing AI literacy and data interpretation training."},{"d":4,"term":"Upskilling","definition":"Improving existing employees' capabilities to work successfully with new technology.","example":"Call-center staff learn to check and correct assistant-drafted responses."},{"d":4,"term":"Reskilling","definition":"Preparing employees to take on substantially different work or roles.","example":"Routine processing staff receive training to become AI quality reviewers."},{"d":4,"term":"AI center of excellence (CoE)","definition":"A cross-functional group that coordinates expertise, reusable practices, and standards.","example":"A business establishes shared AI evaluation templates rather than letting divisions duplicate them."},{"d":4,"term":"Governance operating model","definition":"A defined arrangement of decision rights, roles, review processes, and control ownership.","example":"A company decides which group can approve high-risk AI deployments."},{"d":4,"term":"RACI matrix","definition":"A role allocation tool defining who is responsible, accountable, consulted, and informed.","example":"A program team clarifies who signs off a model's risk acceptance and who performs testing."},{"d":4,"term":"AWS Cloud Adoption Framework (CAF)","definition":"A framework for organizing cloud transformation across business, people, governance, platform, security, and operations perspectives.","example":"A company uses the six CAF perspectives to identify transformation gaps."},{"d":4,"term":"Data quality","definition":"Fitness of data for purpose in dimensions such as accuracy, completeness, consistency, and timeliness.","example":"An assistant produces unreliable recommendations because customer records are outdated."},{"d":4,"term":"Data ownership","definition":"Clear accountability for data stewardship, definitions, quality, access, and lifecycle.","example":"A retailer assigns the sales operations team ownership of product catalog correctness."},{"d":4,"term":"Interoperability","definition":"Ability of systems and processes to exchange and use information effectively.","example":"An AI solution must work with CRM and ERP workflows instead of becoming a separate silo."},{"d":4,"term":"Stage-gate rollout","definition":"Expanding deployment only after explicit criteria for value, risk, and readiness are met.","example":"A pilot moves into production only after meeting defined quality and privacy thresholds."},{"d":4,"term":"Adoption rate","definition":"The proportion of an intended audience actually using a deployed capability.","example":"An HR programme measures what share of eligible employees regularly use an approved copilot."},{"d":4,"term":"Benefits owner","definition":"A person accountable for achieving and sustaining agreed business outcomes.","example":"A contact-center director owns the improvement in first-contact resolution after launch."},{"d":4,"term":"Continuous improvement","definition":"Repeatedly measuring results, receiving feedback, and refining processes and systems.","example":"A support team reviews failure patterns every month and updates its escalation policy."},{"d":4,"term":"Portfolio governance","definition":"Managing multiple AI initiatives together to balance value, resources, risk, and dependencies.","example":"A leadership council stops duplicate pilots and reallocates budget to proven workflows."}]}</script><script>

'use strict';
const DATA=JSON.parse(document.getElementById('payload').textContent);
const PAGES=DATA.pages, QUESTIONS=DATA.questions, TERMS=DATA.terms, DOMAINS=['Overview','AI Fundamentals & Literacy','AI Strategy & Business Value','AI Governance & Responsible AI','Business Readiness & Transformation','Master Revision'];
const root=document.getElementById('screen');const nav=document.getElementById('sidebarNav');
let view='atlas',pageIndex=0,quiz=null,reviewFilter='all',termFilter='',domainFilter='all',quizTimer=null;
const safeRead=(key,fall)=>{try{let x=localStorage.getItem(key);return x?JSON.parse(x):fall}catch(e){return fall}};
const safeWrite=(key,val)=>{try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}};
let done=safeRead('aib_done',{}),bookmarked=safeRead('aib_bookmarks',{}),wrongSaved=safeRead('aib_wrong',{}),best=safeRead('aib_best',null),light=safeRead('aib_light',false);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show');}
function toast(s){const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2500)}
function renderNav(){const query=(document.getElementById('navSearch').value||'').toLowerCase();let out='',last=-1,visible=0;PAGES.forEach((p,i)=>{if(!`${p.title} ${p.sub} ${DOMAINS[p.d]}`.toLowerCase().includes(query))return;visible++;if(p.d!==last){out+=`<div class="nav-caption">${esc(DOMAINS[p.d])}</div>`;last=p.d;}out+=`<button class="navitem ${view==='atlas'&&i===pageIndex?'active':''}" data-page="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="lab">${esc(p.title)}</span>${done[i]?'<span class="tick">✓</span>':''}</button>`;});nav.innerHTML=visible?out:'<p class="helper">No matching lessons.</p>';nav.querySelectorAll('[data-page]').forEach(btn=>btn.onclick=()=>{pageIndex=+btn.dataset.page;view='atlas';closeMenu();render();scrollTo(0,0)});}
function setView(v){view=v;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===v));render();scrollTo(0,0);closeMenu();}
function wrapText(str,limit=19){let words=str.split(' '),out=[''];for(let w of words){let k=out.length-1;if((out[k]+ ' '+w).trim().length>limit)out.push(w);else out[k]+=(out[k]?' ':'')+w;}return out.slice(0,3)}
function drawDiagram(p){const items=p.nodes;let n=items.length,pos=[],links=[];const X=760,Y=266;let shape=p.shape;
 if(shape==='stack'){pos=items.map((_,i)=>[380,43+i*58]);links=items.slice(0,-1).map((_,i)=>[i,i+1]);}
 else if(shape==='matrix'){pos=items.map((_,i)=>[195+(i%2)*370,77+Math.floor(i/2)*115]);}
 else if(shape==='bars'){pos=items.map((_,i)=>[120+i*(520/(Math.max(1,n-1))),120]);}
 else if(shape==='cycle'){let radius=n>6?94:88;pos=items.map((_,i)=>[380+270*Math.cos(-Math.PI/2+i*2*Math.PI/n),135+radius*Math.sin(-Math.PI/2+i*2*Math.PI/n)]);links=items.map((_,i)=>[i,(i+1)%n]);}
 else if(shape==='fork'){pos=[[120,132],...items.slice(1).map((_,i)=>[400+i*0,57+i*75])];links=items.slice(1).map((_,i)=>[0,i+1]);}
 else if(shape==='network'){pos=items.map((_,i)=>[130+(i%3)*240,75+Math.floor(i/3)*118]);links=items.slice(1).map((_,i)=>[i,i+1]);}
 else {pos=items.map((_,i)=>[100+i*(550/Math.max(1,n-1)),132]);links=items.slice(0,-1).map((_,i)=>[i,i+1]);}
 let s=`<svg viewBox="0 0 ${X} ${Y}" role="img" aria-label="Diagram showing ${esc(items.join(' then '))}"><defs><linearGradient id="nodegrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#233958"/><stop offset="1" stop-color="#192b47"/></linearGradient><linearGradient id="edgegrad"><stop offset="0" stop-color="#66d6f2"/><stop offset="1" stop-color="#f5b152"/></linearGradient><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#ffffff" stroke-opacity=".034"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66d6f2"/></marker></defs><rect width="760" height="266" fill="url(#grid)"/><ellipse cx="390" cy="130" rx="290" ry="99" fill="#41a4da" opacity=".025"/>`;
 if(shape==='matrix'){s+='<text x="380" y="20" text-anchor="middle" fill="#91adc5" font-size="12" font-weight="700">CONTEXT × DECISION</text>';}
 for(const [a,b] of links){let [x1,y1]=pos[a], [x2,y2]=pos[b];let t1=x1,t2=x2;if(Math.abs(y2-y1)<25){t1=x1+60;t2=x2-60;}s+=`<line x1="${t1}" y1="${y1}" x2="${t2}" y2="${y2}" stroke="url(#edgegrad)" stroke-width="2" stroke-opacity=".76" marker-end="url(#arr)"/>`;}
 items.forEach((item,i)=>{let [x,y]=pos[i];let width=shape==='stack'?370:shape==='cycle'?118:shape==='matrix'?300:shape==='fork'&&i===0?145:shape==='bars'?126:shape==='network'?173:(n>=6?112:150);let ht=shape==='stack'?44:shape==='matrix'?80:shape==='cycle'?53:shape==='bars'?92:65;let xx=x-width/2,yy=y-ht/2;let lines=wrapText(item,shape==='stack'?43:shape==='matrix'?28:shape==='bars'?15:(n>=6?14:21));s+=`<rect x="${xx}" y="${yy}" rx="${shape==='bars'?12:13}" width="${width}" height="${ht}" fill="url(#nodegrad)" stroke="${i===0?'#e6a35e':'#47749b'}" stroke-width="1.3"/><rect x="${xx+11}" y="${yy+10}" rx="3" width="5" height="${ht-20}" fill="${i===0?'#f3ae56':i%2?'#6ee3be':'#75ccef'}"/><text x="${x+6}" y="${y-(lines.length-1)*8}" fill="#f3f7ff" text-anchor="middle" font-size="${shape==='matrix'?13:12}" font-weight="700">${lines.map((l,j)=>`<tspan x="${x+6}" dy="${j===0?0:17}">${esc(l)}</tspan>`).join('')}</text>`;});s+='</svg>';return s;}
function lessonInner(i,printing=false){let p=PAGES[i],pct=Math.round((i+1)/PAGES.length*100);return `<div class="hero"><div class="kicker"><span class="kline"></span>${esc(DOMAINS[p.d])} · PAGE ${String(i+1).padStart(2,'0')}</div><h1>${esc(p.title)}</h1><p>${esc(p.sub)}</p>${!printing?`<div class="pagenav"><span class="pagecount">Page ${i+1} of ${PAGES.length} · ${pct}% of atlas</span><div class="pager"><button class="btn small" id="prevPage" ${i===0?'disabled':''}>← Prev</button><button class="btn small primary" id="nextPage" ${i===PAGES.length-1?'disabled':''}>Next →</button></div></div><div class="progress"><div style="width:${pct}%"></div></div>`:''}</div><div class="diagram-wrap"><div class="diagram-top"><strong>Visual decision map</strong><span class="mark">Illustrated concept</span></div>${drawDiagram(p)}</div><div class="notes-grid">${p.content}</div><div class="takeaways"><div class="insight"><span>⚑ Exam trap</span><p>${esc(p.trap)}</p></div><div class="insight question"><span>◎ Check your thinking</span><p>${esc(p.question)}</p></div></div>${!printing?`<label class="chapter-done"><input type="checkbox" id="markDone" ${done[i]?'checked':''}/> Mark this chapter as revised</label><p class="footer-note">Study note: content is an independent explanation based on the AIB-C01 exam objectives, not an AWS-authored training module.</p>`:''}`;}
function renderAtlas(){root.innerHTML=lessonInner(pageIndex);document.getElementById('prevPage').onclick=()=>{if(pageIndex>0){pageIndex--;render();scrollTo(0,0)}};document.getElementById('nextPage').onclick=()=>{if(pageIndex<PAGES.length-1){pageIndex++;render();scrollTo(0,0)}};document.getElementById('markDone').onchange=(e)=>{if(e.target.checked)done[pageIndex]=true;else delete done[pageIndex];safeWrite('aib_done',done);renderNav();};}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getSelection(){return {kind:document.getElementById('qKind').value,d:document.getElementById('qDomain').value,count:document.getElementById('qCount').value};}
function selectQuestions(opts){let pool=QUESTIONS.filter(q=>(opts.d==='all'||String(q.d)===opts.d)&& (opts.kind==='all'||opts.kind==='multi'&&q.type==='Multi-select'||opts.kind==='concept'&&(['Definition','Applied concept'].includes(q.type))||opts.kind==='scenario'&&!(['Definition','Applied concept'].includes(q.type))));if(opts.kind==='wrong')pool=QUESTIONS.filter(q=>wrongSaved[q.id] && (opts.d==='all'||String(q.d)===opts.d));if(opts.kind==='bookmarks')pool=QUESTIONS.filter(q=>bookmarked[q.id] && (opts.d==='all'||String(q.d)===opts.d));let target=opts.count==='mock'?85:opts.count==='all'?pool.length:Math.min(+opts.count,pool.length);
 if(opts.count==='mock'&&opts.d==='all'&&opts.kind==='all') {let out=[];for(let d=1;d<=4;d++){let n=[0,20,24,20,21][d];out.push(...shuffle(pool.filter(q=>q.d===d)).slice(0,n));}return shuffle(out)}return shuffle(pool).slice(0,target);}
function beginQuiz(){let opts=getSelection(),selected=selectQuestions(opts);if(!selected.length){toast('No saved questions match these filters.');return;}let timed=opts.count==='mock'&&opts.d==='all'&&opts.kind==='all';quiz={items:selected,pos:0,answers:{},flags:{},done:false,started:Date.now(),timed:timed,seconds:timed?170*60:0,shown:{}};if(quizTimer)clearInterval(quizTimer);if(timed)quizTimer=setInterval(()=>{if(!quiz||quiz.done)return;quiz.seconds=Math.max(0,170*60-Math.floor((Date.now()-quiz.started)/1000));let clock=document.getElementById('clock');if(clock)clock.textContent=fmt(quiz.seconds);if(quiz.seconds===0){clearInterval(quizTimer);finishQuiz();}},1000);renderBank();scrollTo(0,0)}
function fmt(secs){let m=Math.floor(secs/60),s=secs%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function bankHome(){let total=QUESTIONS.length,doneCount=Object.keys(done).length,bm=Object.keys(bookmarked).length,w=Object.keys(wrongSaved).length;root.innerHTML=`<div class="kicker"><span class="kline"></span>INTERACTIVE ASSESSMENT LAB</div><h1 class="bigtitle">500 original practice questions</h1><p class="lede">Definitions, applied concepts, business cases, ROI, privacy, change management, and multi-select. Every question includes its recommended answer and a reason. Questions are shuffled on each launch and the app runs entirely offline.</p><div class="dashboard"><div class="stat"><em>Total questions</em><strong>500</strong><small>Four weighted domains</small></div><div class="stat"><em>Business cases</em><strong>340</strong><small>Scenario-based prompts</small></div><div class="stat"><em>Concept checks</em><strong>160</strong><small>Definitions + application</small></div><div class="stat"><em>Chapters revised</em><strong>${doneCount}/${PAGES.length}</strong><small>${bm} bookmarked · ${w} to revisit</small></div></div><section class="panel"><div class="eyebrow">Create practice session</div><div class="config" style="margin-top:15px"><div class="field"><label for="qDomain">Exam domain</label><select id="qDomain"><option value="all">All domains</option>${[1,2,3,4].map(d=>`<option value="${d}">D${d} · ${esc(DOMAINS[d])}</option>`).join('')}</select></div><div class="field"><label for="qKind">Question style</label><select id="qKind"><option value="all">All question types</option><option value="scenario">Scenario + KPI + risk</option><option value="concept">Definitions + concepts</option><option value="multi">Multi-select only</option><option value="wrong">Previously incorrect (${w})</option><option value="bookmarks">Bookmarked (${bm})</option></select></div><div class="field"><label for="qCount">Session size</label><select id="qCount"><option value="20">20 · Quick review</option><option value="50">50 · Deep practice</option><option value="mock" selected>85 · Timed mock exam</option><option value="100">100 questions</option><option value="200">200 questions</option><option value="all">All matching questions</option></select></div><div class="field"><label>Bank status</label><div class="badge amber" style="margin-top:9px">Independent practice bank</div></div></div><div class="config-actions"><button id="startQuiz" class="btn primary">Begin question session ↗</button><span class="helper">Timed mock uses 85 questions / 170 minutes. Exact multi-select answers are required for credit.</span></div></section><div class="panel"><h3 style="margin-top:0">Exam-aligned question allocation</h3><div class="breakdown">${[1,2,3,4].map(d=>`<div class="bdrow"><div>D${d} · ${esc(DOMAINS[d])}</div><div class="progressbar"><div style="width:${({1:24,2:28,3:24,4:24})[d]}%"></div></div><b>${({1:120,2:140,3:120,4:120})[d]} Q</b></div>`).join('')}</div><p class="helper">Official domain weights: D1 24%, D2 28%, D3 24%, D4 24%. A mock session selects 20/24/20/21 items respectively. This practice percentage is not an AWS scaled score.</p></div>${best?`<div class="panel"><span class="eyebrow">Last completed session</span><h3>${best.pct}% correct · ${best.total} questions</h3><p class="helper">${esc(best.when)} · Return to incorrect questions via the filter above.</p></div>`:''}`;document.getElementById('startQuiz').onclick=beginQuiz;}
function saveAnswer(){if(!quiz||quiz.done)return;let q=quiz.items[quiz.pos];let chosen=[...root.querySelectorAll('input[name="option"]:checked')].map(e=>+e.value).sort((a,b)=>a-b);if(chosen.length)quiz.answers[q.id]=chosen;else delete quiz.answers[q.id];}
function questionView(){let q=quiz.items[quiz.pos],selected=quiz.answers[q.id]||[],answered=Object.keys(quiz.answers).length,pct=answered/quiz.items.length*100;const checked=quiz.shown[q.id];root.innerHTML=`<div class="quiztop"><div><div class="kicker"><span class="kline"></span>EXAM SIMULATOR · DOMAIN ${q.d}</div><h2 style="margin:11px 0 5px">Question ${quiz.pos+1} <span style="font-weight:400;color:var(--muted)">/ ${quiz.items.length}</span></h2><div class="minirow"><span class="badge">${esc(q.type)}</span><span>${esc(DOMAINS[q.d])}</span><span>${answered} answered</span></div></div><div style="text-align:right"><div class="badge amber" id="clock">${quiz.timed?fmt(quiz.seconds):'Untimed'}</div><div style="margin-top:8px"><button class="btn small" id="flag">${quiz.flags[q.id]?'⚑ Flagged':'⚐ Flag'}</button></div></div></div><div class="progressbar" style="margin:22px 0"><div style="width:${pct}%"></div></div><div class="panel"><div class="eyebrow">${esc(q.tag)} · ${q.answer.length>1?'Multiple response (select '+q.answer.length+')':'Single correct answer'}</div><h3 class="qstem">${esc(q.stem)}</h3><div id="choices">${q.options.map((opt,i)=>`<label class="choice ${selected.includes(i)?'selected':''} ${checked&&q.answer.includes(i)?'correct':''} ${checked&&selected.includes(i)&&!q.answer.includes(i)?'incorrect':''}"><input name="option" value="${i}" type="${q.answer.length>1?'checkbox':'radio'}" ${selected.includes(i)?'checked':''} ${checked?'disabled':''}/><span><b style="color:var(--faint);margin-right:7px">${String.fromCharCode(65+i)}.</b>${esc(opt)}</span></label>`).join('')}</div>${checked?`<div class="feedback"><strong>Explanation:</strong> ${esc(q.explanation)}<p style="margin:8px 0 0">Correct answer: ${q.answer.map(i=>String.fromCharCode(65+i)).join(', ')}</p></div>`:''}<div class="qfooter"><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn" id="prevQ" ${quiz.pos===0?'disabled':''}>← Back</button><button class="btn primary" id="nextQ">${quiz.pos===quiz.items.length-1?'Review / submit':'Next question →'}</button></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn small" id="bookmark">${bookmarked[q.id]?'★ Saved':'☆ Save'}</button><button class="btn small" id="reveal" ${checked?'disabled':''}>Check explanation</button></div></div></div><div class="panel"><div class="eyebrow">Question navigator · click any number</div><div class="qpalette">${quiz.items.map((item,i)=>`<button class="qdot ${i===quiz.pos?'here':''} ${quiz.answers[item.id]?'answered':''} ${quiz.flags[item.id]?'flagged':''}" data-q="${i}" title="Question ${i+1}">${i+1}</button>`).join('')}</div><div style="margin-top:17px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span class="helper">Green: answered · Amber underline: flagged</span><button id="finish" class="btn">Submit and review results</button></div></div>`;
 root.querySelectorAll('input[name="option"]').forEach(el=>el.onchange=()=>{saveAnswer();if(q.answer.length>1&&quiz.answers[q.id]?.length>q.answer.length){let v=quiz.answers[q.id];quiz.answers[q.id]=v.slice(-q.answer.length);toast(`Select ${q.answer.length} answers for this question.`);questionView();return;}root.querySelectorAll('.choice').forEach(e=>e.classList.toggle('selected',e.querySelector('input').checked));});
 document.getElementById('flag').onclick=()=>{quiz.flags[q.id]=!quiz.flags[q.id];questionView()};document.getElementById('bookmark').onclick=()=>{bookmarked[q.id]=!bookmarked[q.id];if(!bookmarked[q.id])delete bookmarked[q.id];safeWrite('aib_bookmarks',bookmarked);questionView()};
 document.getElementById('reveal').onclick=()=>{saveAnswer();quiz.shown[q.id]=true;questionView()};
 document.getElementById('prevQ').onclick=()=>{saveAnswer();quiz.pos--;questionView();scrollTo(0,0)};
 document.getElementById('nextQ').onclick=()=>{saveAnswer();if(quiz.pos===quiz.items.length-1)confirmFinish();else{quiz.pos++;questionView();scrollTo(0,0)}};
 document.getElementById('finish').onclick=()=>{saveAnswer();confirmFinish()};root.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{saveAnswer();quiz.pos=+b.dataset.q;questionView();scrollTo(0,0)});
}
function confirmFinish(){const a=Object.keys(quiz.answers).length,un=quiz.items.length-a;if(un&&!confirm(`${un} questions are unanswered. Submit the exam anyway?`))return;finishQuiz();}
function eq(a,b){return a&&a.length===b.length&&a.every((v,i)=>v===b[i])}
function finishQuiz(){if(!quiz||quiz.done)return;if(quizTimer){clearInterval(quizTimer);quizTimer=null;}quiz.done=true;let right=0;for(const q of quiz.items){let good=eq(quiz.answers[q.id],q.answer);if(good){right++;delete wrongSaved[q.id]}else wrongSaved[q.id]=true}safeWrite('aib_wrong',wrongSaved);quiz.correct=right;quiz.pct=Math.round(100*right/quiz.items.length);best={pct:quiz.pct,total:quiz.items.length,when:new Date().toLocaleString()};safeWrite('aib_best',best);reviewFilter='all';renderBank();scrollTo(0,0);}
function resultView(){const n=quiz.items.length,correct=quiz.correct,pct=quiz.pct;let wrong=n-correct;let ds=[1,2,3,4].map(d=>{let qs=quiz.items.filter(q=>q.d===d),r=qs.filter(q=>eq(quiz.answers[q.id],q.answer)).length;return {d,count:qs.length,right:r,pct:qs.length?Math.round(r*100/qs.length):0}}).filter(x=>x.count);let filtered=quiz.items.filter(q=>reviewFilter==='all'||(reviewFilter==='correct'&&eq(quiz.answers[q.id],q.answer))||(reviewFilter==='incorrect'&&!eq(quiz.answers[q.id],q.answer))||(reviewFilter==='flagged'&&quiz.flags[q.id]));root.innerHTML=`<div class="kicker"><span class="kline"></span>SESSION COMPLETE</div><h1 class="bigtitle">Your performance review</h1><p class="lede">Your result is a raw practice score, not a prediction of AWS scaled-score results. Review the underlying business decision for every missed or guessed scenario.</p><div class="result-grid"><div class="panel" style="text-align:center;margin-top:0"><div class="score-ring" style="--pct:${pct}"><span>${pct}%</span></div><strong>${correct} correct / ${n} total</strong><p class="helper">${wrong} incorrect or unanswered</p><button class="btn small" id="printResult">⎙ Print results</button></div><div class="panel" style="margin-top:0"><h3 style="margin-top:0">Performance by domain</h3><div class="breakdown">${ds.map(x=>`<div class="bdrow"><div>D${x.d} · ${esc(DOMAINS[x.d])}</div><div class="progressbar"><div style="width:${x.pct}%"></div></div><b>${x.right}/${x.count}</b></div>`).join('')}</div><div class="minirow" style="margin-top:20px"><span>Unanswered: ${quiz.items.filter(q=>!quiz.answers[q.id]).length}</span><span>Flagged: ${Object.values(quiz.flags).filter(Boolean).length}</span><span>Items to revisit saved automatically</span></div><div class="config-actions"><button class="btn primary" id="newSet">Create another session</button><button class="btn" id="reviewIncorrect">Show incorrect only</button></div></div></div><section class="panel"><div class="quiztop"><div><h3 style="margin:0">Answer review</h3><p class="helper">Includes questions, selected answers, correct answers and explanations.</p></div><select id="reviewFilter" style="background:#0c172a;border:1px solid #354b69;color:white;border-radius:8px;padding:10px"><option value="all">All (${n})</option><option value="incorrect">Incorrect (${wrong})</option><option value="correct">Correct (${correct})</option><option value="flagged">Flagged</option></select></div><div>${filtered.map((q,i)=>{let sel=quiz.answers[q.id]||[],good=eq(sel,q.answer);return `<div class="resultrow"><div class="rheader"><span class="badge ${good?'':'amber'}">${good?'✓ CORRECT':'✕ REVIEW'}</span><span>${esc(q.id)}</span><span>DOMAIN ${q.d} · ${esc(q.type)}</span></div><h4>${esc(q.stem)}</h4><p>Your answer: <b class="${good?'right':'wrong'}">${sel.length?sel.map(ix=>`${String.fromCharCode(65+ix)}. ${esc(q.options[ix])}`).join(' / '):'Unanswered'}</b></p><p>Correct answer: <b class="right">${q.answer.map(ix=>`${String.fromCharCode(65+ix)}. ${esc(q.options[ix])}`).join(' / ')}</b></p><p><b>Why:</b> ${esc(q.explanation)}</p></div>`}).join('')}</div></section>`;
 document.getElementById('reviewFilter').value=reviewFilter;document.getElementById('reviewFilter').onchange=e=>{reviewFilter=e.target.value;resultView()};document.getElementById('newSet').onclick=()=>{quiz=null;bankHome();scrollTo(0,0)};document.getElementById('reviewIncorrect').onclick=()=>{reviewFilter='incorrect';resultView()};document.getElementById('printResult').onclick=()=>{let copy=document.getElementById('printall');copy.innerHTML=`<section class="print-page"><h1>Practice exam review · ${pct}% (${correct}/${n})</h1>${root.querySelector('.result-grid').outerHTML}${root.querySelector('section.panel').outerHTML}</section>`;window.print();};}
function renderBank(){if(!quiz)bankHome();else if(quiz.done)resultView();else questionView();}
function renderGlossary(){let matches=TERMS.filter(t=>(domainFilter==='all'||String(t.d)===domainFilter)&&`${t.term} ${t.definition} ${t.example}`.toLowerCase().includes(termFilter.toLowerCase()));root.innerHTML=`<div class="kicker"><span class="kline"></span>CONCEPT ENCYCLOPEDIA</div><h1 class="bigtitle">80 strategy and AI definitions</h1><p class="lede">Fast, searchable business-level explanations with realistic examples. Every glossary item also appears in the 500-question practice bank.</p><div class="panel" style="display:flex;gap:12px;flex-wrap:wrap"><input id="termSearch" placeholder="Search concepts…" value="${esc(termFilter)}" style="flex:1;min-width:180px;padding:12px;background:#091628;border:1px solid #354b69;border-radius:9px;color:white"><select id="termDomain" style="padding:11px;background:#091628;color:white;border:1px solid #354b69;border-radius:9px"><option value="all">All domains</option>${[1,2,3,4].map(d=>`<option value="${d}">Domain ${d}</option>`).join('')}</select></div><p class="helper">Showing ${matches.length} of ${TERMS.length} concepts</p><div class="glosslist">${matches.map(t=>`<article class="gloss"><span class="badge">DOMAIN ${t.d}</span><h4 style="margin-top:11px">${esc(t.term)}</h4><p>${esc(t.definition)}</p><p style="margin-top:9px;color:var(--sky)">Example: ${esc(t.example)}</p></article>`).join('')}</div>`;
 document.getElementById('termDomain').value=domainFilter;document.getElementById('termSearch').oninput=e=>{termFilter=e.target.value;renderGlossary();const el=document.getElementById('termSearch');el.focus();el.setSelectionRange(termFilter.length,termFilter.length)};document.getElementById('termDomain').onchange=e=>{domainFilter=e.target.value;renderGlossary()};}
function renderSources(){const sources=[['AWS official AIB-C01 exam guide','https://docs.aws.amazon.com/aws-certification/latest/ai-business-strategist-01/ai-business-strategist-01.html','Official scope, objectives, job tasks, exam question format, duration and scoring.'],['AWS AIB-C01 beta certification page','https://aws.amazon.com/certification/certified-ai-business-strategist/','Beta duration, item count, cost and recommended candidate background.'],['AWS AIB-C01 in-scope services','https://docs.aws.amazon.com/aws-certification/latest/ai-business-strategist-01/aib-01-in-scope-services.html','Business-level in-scope services and financial tools.'],['AWS AIB-C01 out-of-scope services','https://docs.aws.amazon.com/aws-certification/latest/ai-business-strategist-01/aib-01-out-of-scope-services.html','Cloud implementation and technical tasks excluded from this exam.'],['AWS training and certification announcement','https://aws.amazon.com/blogs/training-and-certification/introducing-aws-certified-ai-business-strategist-built-for-the-people-who-scale-ai/','AWS announcement and domain rationale, dated 1 September 2026.'],['AWS official practice set on Skill Builder','https://skillbuilder.aws/learn/NN5MQE4G3M/official-practice-question-set-aws-certified-ai-business-strategist-aibc01--english/9TUSJ7NJ7N','Official 20-question set for exam-style calibration; enrollment may be required.']];root.innerHTML=`<div class="kicker"><span class="kline"></span>REFERENCE DESK</div><h1 class="bigtitle">Official sources & study boundaries</h1><p class="lede">This independent atlas and question bank are original learning material. They are not affiliated with, approved by, or distributed by AWS. Always verify exam updates against the official guide.</p><div class="panel"><h3>Important beta distinction</h3><p class="helper" style="font-size:13px">The AWS certification landing page lists the current beta as <b>85 questions and 170 minutes</b>. The general exam guide describes <b>130 minutes</b>. This simulator models the published beta offering (85 / 170). AWS scoring is scaled; our raw percentages cannot be converted directly.</p><h3>Sources</h3>${sources.map(x=>`<a class="source-link" href="${esc(x[1])}" target="_blank" rel="noopener noreferrer"><strong>${esc(x[0])} ↗</strong><small>${esc(x[2])}</small></a>`).join('')}</div><div class="panel"><h3>About the 500 questions</h3><p class="helper" style="font-size:13px">All 500 questions were created for this study companion. They use 80 concept seeds and 85 applied business cases, each examined from multiple angles. They are not leaked or recalled AWS exam questions. They are designed to strengthen business decision-making and should be complemented by AWS’s official preparation resources.</p></div>`;}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===view));renderNav();if(view==='atlas')renderAtlas();else if(view==='bank')renderBank();else if(view==='glossary')renderGlossary();else renderSources();}
function printNotes(){let stage=document.getElementById('printall');stage.innerHTML=PAGES.map((p,i)=>`<section class="print-page">${lessonInner(i,true)}</section>`).join('');window.print()}
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>setView(btn.dataset.tab));document.getElementById('navSearch').oninput=renderNav;document.getElementById('mobileMenu').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('show')};document.getElementById('scrim').onclick=closeMenu;document.getElementById('printBtn').onclick=printNotes;
document.getElementById('themeBtn').onclick=()=>{light=!light;safeWrite('aib_light',light);document.body.classList.toggle('lite',light);toast(light?'Light theme enabled':'Dark theme enabled')};
function applyLightStyle(){let sheet=document.createElement('style');sheet.innerHTML='body.lite{--bg:#e8eef6;--panel:#e9f0f7;--panel2:#e6edf6;--surface:#2d425d;--edge:#aab9c9;--text:#f5f8fc;--muted:#b3c5db;--faint:#a4b1ca;background:#dce5f1}.lite .main{background:#e2eaf4}.lite .hero h1,.lite .hero p,.lite .hero .pagecount,.lite .bigtitle,.lite .lede{color:#213149}.lite .topbar{background:#dae5f2eb}.lite .tab{color:#31415d}.lite .tab.active{background:#30425e;color:white}.lite .note-card,.lite .panel,.lite .diagram-wrap,.lite .stat{box-shadow:0 6px 22px #3f50711d}.lite .topbar .iconbtn{background:#34445d}';document.head.append(sheet)}
applyLightStyle();document.body.classList.toggle('lite',light);
render();

</script></body></html>
