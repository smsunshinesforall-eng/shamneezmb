this AI do and where does it fail?<\/li><li><strong>Domain 2:<\/strong> Which opportunity merits money, and how would we prove the value?<\/li><li><strong>Domain 3:<\/strong> What could go wrong, who owns the risk, and what oversight is needed?<\/li><li><strong>Domain 4:<\/strong> Are the people, processes, data, and operations ready to make it stick?<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>A typical exam decision sequence<\/h3><ul><li>Identify the stated business goal and constraints first.<\/li><li>Choose the smallest viable, measurable intervention rather than the most complex model.<\/li><li>Require owners, guardrails, controls, and a baseline before declaring readiness.<\/li><li>Expand only after economic, quality, safety, and adoption gates are achieved.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Out of scope<\/h3><ul><li>No coding or tuning algorithms; no subnet designs, EC2 configuration, or IAM policy writing.<\/li><li>Know selected AWS services only at the business-purpose level; details of console implementation are not central.<\/li><\/ul><\/section>"},{"d":0,"title":"A universal decision canvas","sub":"Eight questions you can apply to any scenario","shape":"cycle","nodes":["Problem","Value","Fit","Data","Controls","Pilot","Adoption","Scale"],"blocks":[["Questions 1–4: qualification",["What business outcome changes, and who owns it?","What is today’s baseline, and how will uplift be attributed?","Is rules-based automation, predictive ML, GenAI, or no AI most appropriate?","Are data quality, permissions, and integration sufficient?"]],["Questions 5–8: execution",["What safety, fairness, privacy, security, and third-party risks exist?","What go/no-go thresholds must the pilot meet?","Which frontline stakeholders need training and workflow changes?","What cost, support, monitoring and review arrangements enable scale?"]],["The fast exam heuristic",["BEST / FIRST: choose diagnosis and baseline before buying or scaling.","MOST important: align the action with the strongest stated constraint.","LEAST likely: reject options that substitute hype, usage, or model size for validated business value."]]],"trap":"Risk severity can override speed-to-market, especially in healthcare, finance and public-service decisions.","question":"Which missing fact would most change the decision?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Questions 1–4: qualification<\/h3><ul><li>What business outcome changes, and who owns it?<\/li><li>What is today’s baseline, and how will uplift be attributed?<\/li><li>Is rules-based automation, predictive ML, GenAI, or no AI most appropriate?<\/li><li>Are data quality, permissions, and integration sufficient?<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Questions 5–8: execution<\/h3><ul><li>What safety, fairness, privacy, security, and third-party risks exist?<\/li><li>What go/no-go thresholds must the pilot meet?<\/li><li>Which frontline stakeholders need training and workflow changes?<\/li><li>What cost, support, monitoring and review arrangements enable scale?<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>The fast exam heuristic<\/h3><ul><li><strong>BEST / FIRST:<\/strong> choose diagnosis and baseline before buying or scaling.<\/li><li><strong>MOST important:<\/strong> align the action with the strongest stated constraint.<\/li><li><strong>LEAST likely:<\/strong> reject options that substitute hype, usage, or model size for validated business value.<\/li><\/ul><\/section>"},{"d":1,"title":"AI, ML and GenAI","sub":"The hierarchy of intelligent systems","shape":"stack","nodes":["Artificial intelligence","Machine learning","Deep learning","Generative AI"],"blocks":[["Do not confuse terms",["Artificial intelligence is the wider field of machine capabilities associated with intelligence.","Machine learning uses learned patterns from data; supervised ML learns from labels and unsupervised ML discovers structure.","Deep learning is a family of ML methods using neural networks with multiple layers.","Generative AI produces novel content; a foundation model is broadly pretrained and adaptable to many tasks."]],["Translate request to solution",["Forecast next-month sales in dollars → regression.","Tag invoices as fraudulent/not fraudulent → classification.","Group subscribers by usage → clustering.","Draft a polite answer using approved policy → generative AI with grounding."]],["The strategist’s judgment",["Choose the simplest technology that reliably satisfies the need.","Ask for representative evaluations, not only claims of model capability."]]],"trap":"A conventional database query or deterministic rule can be the correct answer.","question":"When is generative AI unnecessary?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Do not confuse terms<\/h3><ul><li>Artificial intelligence is the wider field of machine capabilities associated with intelligence.<\/li><li>Machine learning uses learned patterns from data; supervised ML learns from labels and unsupervised ML discovers structure.<\/li><li>Deep learning is a family of ML methods using neural networks with multiple layers.<\/li><li>Generative AI produces novel content; a foundation model is broadly pretrained and adaptable to many tasks.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Translate request to solution<\/h3><ul><li>Forecast next-month sales in dollars <span class=\"arrword\">→<\/span> regression.<\/li><li>Tag invoices as fraudulent/not fraudulent <span class=\"arrword\">→<\/span> classification.<\/li><li>Group subscribers by usage <span class=\"arrword\">→<\/span> clustering.<\/li><li>Draft a polite answer using approved policy <span class=\"arrword\">→<\/span> generative AI with grounding.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>The strategist’s judgment<\/h3><ul><li>Choose the simplest technology that reliably satisfies the need.<\/li><li>Ask for representative evaluations, not only claims of model capability.<\/li><\/ul><\/section>"},{"d":1,"title":"Choose the right AI modality","sub":"Different inputs demand different types of AI","shape":"fork","nodes":["Business problem","Predictive ML","Text / NLP","Vision / documents"],"blocks":[["Predictive and analytical",["Classification predicts discrete categories; evaluate precision, recall, and F1 when errors differ in cost.","Regression predicts numeric outcomes; evaluate MAE or other business-relevant error measures.","Clustering finds patterns without known labels; assess whether groups are actionable.","Recommenders rank relevant items; validate genuine business uplift."]],["Language, image, and documents",["NLP extracts meaning from text; sentiment, entity extraction and routing are examples.","Computer vision interprets images and video for quality inspection or scene recognition.","Document extraction converts semi-structured or unstructured documents into usable fields."]],["Decision checklist",["Identify the target output and acceptable errors.","Evaluate data readiness, consent, and the cost of human verification.","Choose objective-specific metrics; aggregate accuracy alone can obscure rare costly misses."]]],"trap":"Do not use a creative-text model when a precise, auditable calculation would do.","question":"Which metric reflects the cost of a missed fraud case?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Predictive and analytical<\/h3><ul><li>Classification predicts discrete categories; evaluate precision, recall, and F1 when errors differ in cost.<\/li><li>Regression predicts numeric outcomes; evaluate MAE or other business-relevant error measures.<\/li><li>Clustering finds patterns without known labels; assess whether groups are actionable.<\/li><li>Recommenders rank relevant items; validate genuine business uplift.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Language, image, and documents<\/h3><ul><li>NLP extracts meaning from text; sentiment, entity extraction and routing are examples.<\/li><li>Computer vision interprets images and video for quality inspection or scene recognition.<\/li><li>Document extraction converts semi-structured or unstructured documents into usable fields.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Decision checklist<\/h3><ul><li>Identify the target output and acceptable errors.<\/li><li>Evaluate data readiness, consent, and the cost of human verification.<\/li><li>Choose objective-specific metrics; aggregate accuracy alone can obscure rare costly misses.<\/li><\/ul><\/section>"},{"d":1,"title":"Foundation models and inference","sub":"What matters commercially about a model","shape":"flow","nodes":["Business input","Model / context","Inference output","Evaluation"],"blocks":[["Core vocabulary",["Training changes model parameters using data and an optimization process.","Inference uses a trained model to process new prompts or records.","Tokens are chunks of text that affect usage and cost; a context window limits information considered per request.","Latency, throughput, quality, privacy, and cost vary across models."]],["Commercial trade-offs",["Larger models are not automatically better for simple classification or structured extraction.","Long inputs and outputs can raise cost and latency.","Rights over input data and outputs, retention, and geographic processing require vendor due diligence."]],["Model selection framework",["Start with target accuracy, language coverage, response-time requirement, safety and data sensitivity.","Benchmark the smallest suitable solution at realistic demand levels."]]],"trap":"Changing model size does not repair poor source data or weak outcome definitions.","question":"Why might a smaller model be the strategically better choice?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Core vocabulary<\/h3><ul><li>Training changes model parameters using data and an optimization process.<\/li><li>Inference uses a trained model to process new prompts or records.<\/li><li>Tokens are chunks of text that affect usage and cost; a context window limits information considered per request.<\/li><li>Latency, throughput, quality, privacy, and cost vary across models.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Commercial trade-offs<\/h3><ul><li>Larger models are not automatically better for simple classification or structured extraction.<\/li><li>Long inputs and outputs can raise cost and latency.<\/li><li>Rights over input data and outputs, retention, and geographic processing require vendor due diligence.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Model selection framework<\/h3><ul><li>Start with target accuracy, language coverage, response-time requirement, safety and data sensitivity.<\/li><li>Benchmark the smallest suitable solution at realistic demand levels.<\/li><\/ul><\/section>"},{"d":1,"title":"Prompt engineering","sub":"Instruct; constrain; verify","shape":"flow","nodes":["Role / task","Context / facts","Output schema","Quality checks"],"blocks":[["High-performing prompt anatomy",["Specify the task and intended audience.","Supply bounded context and approved source material.","Set exact output requirements: fields, format, tone, exclusions, and length.","Provide representative examples when useful; instruct the model to acknowledge missing evidence."]],["Few-shot, zero-shot and structured outputs",["Zero-shot: instructions without examples; useful for straightforward tasks.","Few-shot: a few demonstrations of desired output; helpful for consistent formats.","Structured output: a schema or field list so downstream processes can validate content."]],["Validation",["Test on representative edge cases and multiple languages where relevant.","Check grounding, omissions, prohibited disclosures, and formatting compliance.","Human review remains necessary for material decisions and claims."]]],"trap":"Prompt engineering influences outputs but does not guarantee truth or eliminate injection risks.","question":"What would you add to a prompt for a board-ready summary?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>High-performing prompt anatomy<\/h3><ul><li>Specify the task and intended audience.<\/li><li>Supply bounded context and approved source material.<\/li><li><strong>Set exact output requirements:<\/strong> fields, format, tone, exclusions, and length.<\/li><li>Provide representative examples when useful; instruct the model to acknowledge missing evidence.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Few-shot, zero-shot and structured outputs<\/h3><ul><li><strong>Zero-shot:<\/strong> instructions without examples; useful for straightforward tasks.<\/li><li><strong>Few-shot:<\/strong> a few demonstrations of desired output; helpful for consistent formats.<\/li><li><strong>Structured output:<\/strong> a schema or field list so downstream processes can validate content.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Validation<\/h3><ul><li>Test on representative edge cases and multiple languages where relevant.<\/li><li>Check grounding, omissions, prohibited disclosures, and formatting compliance.<\/li><li>Human review remains necessary for material decisions and claims.<\/li><\/ul><\/section>"},{"d":1,"title":"RAG versus fine-tuning","sub":"Two different levers for reliable GenAI","shape":"rag","nodes":["Question","Retrieve sources","LLM with context","Verified answer"],"blocks":[["Retrieval-augmented generation",["RAG retrieves relevant sources at runtime and supplies them to the model.","Best for changing internal manuals, policy documents, product catalogs, and traceable source answers.","It requires retrieval quality, access control, document stewardship, and source versioning."]],["Fine-tuning",["Additional training adapts model behavior or specialized task performance.","Useful when consistent domain response patterns or formats are not achieved with prompting.","Not a substitute for retrieving frequently updated facts or for authorizing private data."]],["Strategist decision",["First compare prompting with an evaluated baseline.","Choose RAG for current knowledge and source traceability.","Consider fine-tuning only with justified evidence, representative training data, evaluation and lifecycle cost."]]],"trap":"RAG still can retrieve misleading documents and hallucinate; test evidence fidelity.","question":"A policy changes weekly: what design should be explored first?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Retrieval-augmented generation<\/h3><ul><li>RAG retrieves relevant sources at runtime and supplies them to the model.<\/li><li>Best for changing internal manuals, policy documents, product catalogs, and traceable source answers.<\/li><li>It requires retrieval quality, access control, document stewardship, and source versioning.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Fine-tuning<\/h3><ul><li>Additional training adapts model behavior or specialized task performance.<\/li><li>Useful when consistent domain response patterns or formats are not achieved with prompting.<\/li><li>Not a substitute for retrieving frequently updated facts or for authorizing private data.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Strategist decision<\/h3><ul><li>First compare prompting with an evaluated baseline.<\/li><li>Choose RAG for current knowledge and source traceability.<\/li><li>Consider fine-tuning only with justified evidence, representative training data, evaluation and lifecycle cost.<\/li><\/ul><\/section>"},{"d":1,"title":"Agentic AI","sub":"From answering questions to taking actions","shape":"agents","nodes":["User goal","Planner / agent","Authorized tools","Human approval","Audit"],"blocks":[["Agent versus assistant",["A chat assistant mainly produces outputs. An agent can plan steps and call tools to change records or trigger operations.","Tool use introduces new risks: unauthorized actions, recursive costs, errors propagated across systems, and prompt injection."]],["Controls for business use",["Least-privilege tool access; approval for irreversible or sensitive actions.","Clear allowed-task boundaries, spending and rate limits, logging, and fail-safe fallback.","Human escalation on low confidence, high risk, or conflicting instructions."]],["Example",["An appointment assistant can suggest slots freely but should request confirmation before creating, cancelling or changing a booking."]]],"trap":"Do not give an agent broad administrator privileges for convenience.","question":"What changes when an AI can send messages and alter customer records?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Agent versus assistant<\/h3><ul><li>A chat assistant mainly produces outputs. An agent can plan steps and call tools to change records or trigger operations.<\/li><li><strong>Tool use introduces new risks:<\/strong> unauthorized actions, recursive costs, errors propagated across systems, and prompt injection.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Controls for business use<\/h3><ul><li>Least-privilege tool access; approval for irreversible or sensitive actions.<\/li><li>Clear allowed-task boundaries, spending and rate limits, logging, and fail-safe fallback.<\/li><li>Human escalation on low confidence, high risk, or conflicting instructions.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Example<\/h3><ul><li>An appointment assistant can suggest slots freely but should request confirmation before creating, cancelling or changing a booking.<\/li><\/ul><\/section>"},{"d":1,"title":"Data and evaluation fundamentals","sub":"Data fitness beats demo fluency","shape":"cycle","nodes":["Quality","Representativeness","Baseline","Evaluation","Monitoring"],"blocks":[["Data readiness",["Assess accuracy, completeness, timeliness, consistency, provenance and permitted use.","Check representative coverage for customer groups, seasonal changes, languages and edge cases.","Define stewardship and data access before scaling the model."]],["Measure what matters",["Classification: precision, recall and F1; inspect subgroup results and confusion errors.","Generation: groundedness, correctness, safety, task success, user satisfaction and review cost.","Agents: authorized task completion, inappropriate tool calls, rollback ability and escalation rate."]],["Production discipline",["Define acceptance thresholds before pilots; monitor drift and feedback after launch.","Use human review where consequences warrant it."]]],"trap":"One headline “accuracy” number cannot prove safety, fairness or usefulness.","question":"What are the five worst failure cases for this use case?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Data readiness<\/h3><ul><li>Assess accuracy, completeness, timeliness, consistency, provenance and permitted use.<\/li><li>Check representative coverage for customer groups, seasonal changes, languages and edge cases.<\/li><li>Define stewardship and data access before scaling the model.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Measure what matters<\/h3><ul><li><strong>Classification:<\/strong> precision, recall and F1; inspect subgroup results and confusion errors.<\/li><li><strong>Generation:<\/strong> groundedness, correctness, safety, task success, user satisfaction and review cost.<\/li><li><strong>Agents:<\/strong> authorized task completion, inappropriate tool calls, rollback ability and escalation rate.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Production discipline<\/h3><ul><li>Define acceptance thresholds before pilots; monitor drift and feedback after launch.<\/li><li>Use human review where consequences warrant it.<\/li><\/ul><\/section>"},{"d":2,"title":"Find the highest-value opportunity","sub":"Begin with a problem, not with AI","shape":"matrix","nodes":["High value / feasible","High value / hard","Low value / feasible","Low value / hard"],"blocks":[["Opportunity discovery",["Map high-friction workflows, repeated decisions and unmet customer needs.","Estimate frequency, baseline time or cost, quality failure, revenue upside, and urgency.","Compare against non-AI alternatives such as process redesign and standard automation."]],["Prioritization dimensions",["Strategic importance and quantified upside.","Data and technical feasibility; integration and operational readiness.","Privacy, regulatory, security, reputational, and model-performance risk.","Time to value, organizational capacity, dependencies, and reversibility."]],["Portfolio approach",["Use a common scorecard; balance near-term quick wins with strategic differentiators.","Document why options are deprioritized; revisit as capabilities mature."]]],"trap":"“Competitors have it” is not evidence of a strong AI use case.","question":"Would the business problem still exist if AI did not exist?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Opportunity discovery<\/h3><ul><li>Map high-friction workflows, repeated decisions and unmet customer needs.<\/li><li>Estimate frequency, baseline time or cost, quality failure, revenue upside, and urgency.<\/li><li>Compare against non-AI alternatives such as process redesign and standard automation.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Prioritization dimensions<\/h3><ul><li>Strategic importance and quantified upside.<\/li><li>Data and technical feasibility; integration and operational readiness.<\/li><li>Privacy, regulatory, security, reputational, and model-performance risk.<\/li><li>Time to value, organizational capacity, dependencies, and reversibility.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Portfolio approach<\/h3><ul><li>Use a common scorecard; balance near-term quick wins with strategic differentiators.<\/li><li>Document why options are deprioritized; revisit as capabilities mature.<\/li><\/ul><\/section>"},{"d":2,"title":"Outcome KPIs and baselines","sub":"Measure customer impact and business value","shape":"flow","nodes":["Current baseline","Target KPI","Controlled pilot","Verified uplift"],"blocks":[["Three metric layers",["Activity: prompts sent, users logged in, documents generated.","Operational: cycle time, error rate, first-contact resolution, handle time.","Business: customer retention, margin, revenue, cost avoided, risk loss reduced."]],["Evidence quality",["Capture pre-intervention baselines; define the comparison group or credible counterfactual.","Separate measured outcomes from estimates; check whether saved minutes convert into real capacity or cash.","Include quality, safety and customer experience guardrails alongside efficiency metrics."]],["KPI examples",["Support: cost per resolved case and customer satisfaction.","Sales: proposal cycle time and win rate.","Finance: verified accuracy and cost per accepted document."]]],"trap":"Improved model accuracy is not automatically equivalent to business ROI.","question":"What would a CFO accept as actual proof of value?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Three metric layers<\/h3><ul><li><strong>Activity:<\/strong> prompts sent, users logged in, documents generated.<\/li><li><strong>Operational:<\/strong> cycle time, error rate, first-contact resolution, handle time.<\/li><li><strong>Business:<\/strong> customer retention, margin, revenue, cost avoided, risk loss reduced.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Evidence quality<\/h3><ul><li>Capture pre-intervention baselines; define the comparison group or credible counterfactual.<\/li><li>Separate measured outcomes from estimates; check whether saved minutes convert into real capacity or cash.<\/li><li>Include quality, safety and customer experience guardrails alongside efficiency metrics.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>KPI examples<\/h3><ul><li><strong>Support:<\/strong> cost per resolved case and customer satisfaction.<\/li><li><strong>Sales:<\/strong> proposal cycle time and win rate.<\/li><li><strong>Finance:<\/strong> verified accuracy and cost per accepted document.<\/li><\/ul><\/section>"},{"d":2,"title":"ROI, payback and NPV","sub":"Choose the right financial lens","shape":"formula","nodes":["Benefits","Costs","Net value","Decision"],"blocks":[["Key formulas",["ROI (%) = [(total benefits − total costs) / total costs] × 100, under an explicitly stated period and convention.","Simple payback (months) = initial investment / recurring monthly net benefit, assuming steady benefit.","Net present value (NPV) = sum of discounted future net cash flows − initial investment.","Unit saving = existing cost per accepted output − AI-assisted fully loaded cost per accepted output."]],["Worked example",["A pilot costs $120,000 initially. Ongoing operations cost $30,000 in year one; year-one benefit is $210,000.","Year-one ROI = (210,000 − 150,000) / 150,000 = 40%.","The numerical formula is meaningful only if costs, benefits, timeframe, attribution and assumptions are transparent."]],["Sensitivity matters",["Test low adoption, lower productivity uplift, higher model-consumption cost, and regulatory overhead.","Separate cash savings, released capacity, revenue growth, avoided losses and qualitative strategic benefits."]]],"trap":"Never add annual benefits to multiyear costs without matching periods.","question":"What changes if AI processing usage doubles?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Key formulas<\/h3><ul><li>ROI (%) = [(total benefits − total costs) / total costs] × 100, under an explicitly stated period and convention.<\/li><li>Simple payback (months) = initial investment / recurring monthly net benefit, assuming steady benefit.<\/li><li>Net present value (NPV) = sum of discounted future net cash flows − initial investment.<\/li><li>Unit saving = existing cost per accepted output − AI-assisted fully loaded cost per accepted output.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Worked example<\/h3><ul><li>A pilot costs $120,000 initially. Ongoing operations cost $30,000 in year one; year-one benefit is $210,000.<\/li><li>Year-one ROI = (210,000 − 150,000) / 150,000 = 40%.<\/li><li>The numerical formula is meaningful only if costs, benefits, timeframe, attribution and assumptions are transparent.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Sensitivity matters<\/h3><ul><li>Test low adoption, lower productivity uplift, higher model-consumption cost, and regulatory overhead.<\/li><li>Separate cash savings, released capacity, revenue growth, avoided losses and qualitative strategic benefits.<\/li><\/ul><\/section>"},{"d":2,"title":"Total cost of ownership","sub":"Costs hide in the lifecycle","shape":"stack","nodes":["Upfront setup","Usage + licences","Integration + review","Governance + support"],"blocks":[["Include these cost buckets",["Discovery, procurement, migration and integration.","Model inference, licenses, seats, storage, networking or provisioned capacity as applicable.","Security, privacy, auditing, human quality checks and incident response.","Training, adoption programmes, vendor management, support and continuous evaluation."]],["Different pricing patterns",["Consumption-based: variable with usage, tokens, requests or processed content.","Seat-based: cost tied to licensed users.","Instance/provisioned: capacity committed even when demand fluctuates."]],["Financial safeguards",["Forecast demand with realistic volumes, sensitivity ranges and performance thresholds.","Monitor cost per accepted output, not just total cloud spending.","Assess exit and data portability costs in supplier comparison."]]],"trap":"A cheap pilot can become an expensive product at scale.","question":"What recurring costs are omitted from the vendor proposal?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Include these cost buckets<\/h3><ul><li>Discovery, procurement, migration and integration.<\/li><li>Model inference, licenses, seats, storage, networking or provisioned capacity as applicable.<\/li><li>Security, privacy, auditing, human quality checks and incident response.<\/li><li>Training, adoption programmes, vendor management, support and continuous evaluation.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Different pricing patterns<\/h3><ul><li><strong>Consumption-based:<\/strong> variable with usage, tokens, requests or processed content.<\/li><li><strong>Seat-based:<\/strong> cost tied to licensed users.<\/li><li><strong>Instance/provisioned:<\/strong> capacity committed even when demand fluctuates.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Financial safeguards<\/h3><ul><li>Forecast demand with realistic volumes, sensitivity ranges and performance thresholds.<\/li><li>Monitor cost per accepted output, not just total cloud spending.<\/li><li>Assess exit and data portability costs in supplier comparison.<\/li><\/ul><\/section>"},{"d":2,"title":"Build, buy or partner","sub":"Strategic sourcing instead of reflexive development","shape":"fork","nodes":["Business need","Build","Buy","Partner"],"blocks":[["Build when",["Differentiation is meaningful, data rights and capabilities support development, and lifecycle ownership is funded.","A packaged solution cannot meet a unique strategic requirement."]],["Buy when",["Requirements are fairly standardized, time to value matters and a governed market solution meets constraints.","Total cost, integration, terms and exit rights pass due diligence."]],["Partner when",["Expertise or delivery capacity is missing but internal ownership of outcomes and risks can be retained.","Contracts include service levels, data protections, capability transfer and clear accountability."]],["Procurement test",["Assess functionality, measurable value, implementation risk, support, cost, data retention, auditability, portability and vendor dependency."]]],"trap":"Never assume that building always provides control or buying always reduces risk.","question":"Which option minimizes risk-adjusted time to value?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Build when<\/h3><ul><li>Differentiation is meaningful, data rights and capabilities support development, and lifecycle ownership is funded.<\/li><li>A packaged solution cannot meet a unique strategic requirement.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Buy when<\/h3><ul><li>Requirements are fairly standardized, time to value matters and a governed market solution meets constraints.<\/li><li>Total cost, integration, terms and exit rights pass due diligence.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Partner when<\/h3><ul><li>Expertise or delivery capacity is missing but internal ownership of outcomes and risks can be retained.<\/li><li>Contracts include service levels, data protections, capability transfer and clear accountability.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Procurement test<\/h3><ul><li>Assess functionality, measurable value, implementation risk, support, cost, data retention, auditability, portability and vendor dependency.<\/li><\/ul><\/section>"},{"d":2,"title":"Proof of concept to scaled value","sub":"Different stages answer different questions","shape":"gates","nodes":["Feasibility / PoC","Real-world pilot","MVP / launch","Scale / optimize"],"blocks":[["Proof of concept",["Purpose: demonstrate technical feasibility using constrained examples.","It does not prove economics or staff adoption."]],["Pilot",["Purpose: test a real workflow, with data permissions, operators, measurable baseline and risk controls.","Set thresholds for performance, cost, stakeholder satisfaction, safety and governance."]],["Minimum viable product and scale",["MVP: smallest usable version offering a valuable end-to-end capability.","Scale only after operating ownership, monitoring, integration, incident management, support and total-cost forecasts are established."]],["Stage-gate decisions",["Go if value and risk criteria pass; revise if gaps are fixable; stop if economics or harms are unacceptable."]]],"trap":"Successful technology demonstrations are not authorization for enterprise rollout.","question":"What evidence moves a pilot into production?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Proof of concept<\/h3><ul><li><strong>Purpose:<\/strong> demonstrate technical feasibility using constrained examples.<\/li><li>It does not prove economics or staff adoption.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Pilot<\/h3><ul><li><strong>Purpose:<\/strong> test a real workflow, with data permissions, operators, measurable baseline and risk controls.<\/li><li>Set thresholds for performance, cost, stakeholder satisfaction, safety and governance.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Minimum viable product and scale<\/h3><ul><li><strong>MVP:<\/strong> smallest usable version offering a valuable end-to-end capability.<\/li><li>Scale only after operating ownership, monitoring, integration, incident management, support and total-cost forecasts are established.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Stage-gate decisions<\/h3><ul><li>Go if value and risk criteria pass; revise if gaps are fixable; stop if economics or harms are unacceptable.<\/li><\/ul><\/section>"},{"d":2,"title":"AI portfolio and competitive advantage","sub":"Optimize investment across the enterprise","shape":"network","nodes":["Strategy","Customer value","Capabilities","Portfolio","Outcome"],"blocks":[["Portfolio governance",["Compare use cases using consistent financial and nonfinancial criteria.","Account for shared data, staff and integration dependencies.","Avoid duplicate pilots and bring underperforming projects to a transparent stop decision."]],["Competitive value options",["Operational efficiency reduces service cost or turnaround time.","Experience improvement can increase loyalty or convenience.","New products or business models can create defensible revenue; differentiated data and operating capability may matter more than generic models."]],["Timing and uncertainty",["Use scenarios and sensitivity analysis for demand, price, competitor moves, regulatory change and adoption.","Prioritize initiatives capable of creating lasting change, not simply visible AI adoption."]]],"trap":"Buying the same generic chatbot as rivals does not itself create defensible differentiation.","question":"What advantage would remain when competitors adopt similar AI?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Portfolio governance<\/h3><ul><li>Compare use cases using consistent financial and nonfinancial criteria.<\/li><li>Account for shared data, staff and integration dependencies.<\/li><li>Avoid duplicate pilots and bring underperforming projects to a transparent stop decision.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Competitive value options<\/h3><ul><li>Operational efficiency reduces service cost or turnaround time.<\/li><li>Experience improvement can increase loyalty or convenience.<\/li><li>New products or business models can create defensible revenue; differentiated data and operating capability may matter more than generic models.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Timing and uncertainty<\/h3><ul><li>Use scenarios and sensitivity analysis for demand, price, competitor moves, regulatory change and adoption.<\/li><li>Prioritize initiatives capable of creating lasting change, not simply visible AI adoption.<\/li><\/ul><\/section>"},{"d":2,"title":"Business scenario playbook","sub":"Match the problem to a measurable result","shape":"bars","nodes":["CX: resolution","Sales: conversion","Operations: unit cost","Risk: loss avoided"],"blocks":[["Contact center",["Use case: agent summarization or knowledge search.","Baseline: after-call work, customer satisfaction and first-contact resolution.","Value: lower cost per resolved case without sacrificing service quality."]],["Finance and document processing",["Use case: invoice extraction and exception handling.","Baseline: time per accepted invoice, rework, incorrect payments.","Value: lower approved-document cost with reliable control checks."]],["Healthcare and public administration",["Use case: scheduling, triage support or record summarization.","Baseline: waiting time, error rate and service access.","Value: improved service with strict human oversight, data privacy and auditability."]]],"trap":"The same model may need radically different controls depending on the consequence of errors.","question":"Which outcomes and controls differ between marketing and medical advice?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Contact center<\/h3><ul><li><strong>Use case:<\/strong> agent summarization or knowledge search.<\/li><li><strong>Baseline:<\/strong> after-call work, customer satisfaction and first-contact resolution.<\/li><li><strong>Value:<\/strong> lower cost per resolved case without sacrificing service quality.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Finance and document processing<\/h3><ul><li><strong>Use case:<\/strong> invoice extraction and exception handling.<\/li><li><strong>Baseline:<\/strong> time per accepted invoice, rework, incorrect payments.<\/li><li><strong>Value:<\/strong> lower approved-document cost with reliable control checks.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Healthcare and public administration<\/h3><ul><li><strong>Use case:<\/strong> scheduling, triage support or record summarization.<\/li><li><strong>Baseline:<\/strong> waiting time, error rate and service access.<\/li><li><strong>Value:<\/strong> improved service with strict human oversight, data privacy and auditability.<\/li><\/ul><\/section>"},{"d":3,"title":"Principles of responsible AI","sub":"Responsible business outcomes require deliberate trade-offs","shape":"cycle","nodes":["Fairness","Safety","Privacy","Transparency","Accountability","Oversight"],"blocks":[["What principles mean in practice",["Fairness: investigate unjustified outcome differences between relevant populations.","Transparency: communicate AI use, limitations, and appropriate disclosures.","Explainability: provide understandable reasons and evidence where decisions warrant it.","Privacy and security: control collection, processing, access, disclosure and retention.","Safety and reliability: evaluate harmful outcomes, edge cases, and failure handling."]],["Proportionality",["Low-risk draft marketing copy may need editorial approval.","High-impact credit, clinical or eligibility decisions require stronger testing, meaningful review and appeal."]],["Strategist ownership",["Establish required controls, roles, escalation and acceptance criteria before deployment."]]],"trap":"The fastest or most accurate model may still be unsuitable if it produces harmful disparities.","question":"Which responsible-AI principle matters most in the presented context?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>What principles mean in practice<\/h3><ul><li><strong>Fairness:<\/strong> investigate unjustified outcome differences between relevant populations.<\/li><li><strong>Transparency:<\/strong> communicate AI use, limitations, and appropriate disclosures.<\/li><li><strong>Explainability:<\/strong> provide understandable reasons and evidence where decisions warrant it.<\/li><li><strong>Privacy and security:<\/strong> control collection, processing, access, disclosure and retention.<\/li><li><strong>Safety and reliability:<\/strong> evaluate harmful outcomes, edge cases, and failure handling.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Proportionality<\/h3><ul><li>Low-risk draft marketing copy may need editorial approval.<\/li><li>High-impact credit, clinical or eligibility decisions require stronger testing, meaningful review and appeal.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Strategist ownership<\/h3><ul><li>Establish required controls, roles, escalation and acceptance criteria before deployment.<\/li><\/ul><\/section>"},{"d":3,"title":"Fairness and explainability","sub":"Look beneath aggregate success rates","shape":"matrix","nodes":["True positives","False positives","False negatives","True negatives"],"blocks":[["Bias and fairness evaluation",["Representative inputs, historical bias, proxy variables and labeling choices can affect outcomes.","Aggregate accuracy may hide poor performance for smaller user segments.","Assess relevant fairness metrics with appropriate legal and domain expertise."]],["Explainability and contestability",["People affected by material decisions may need intelligible reasons and a way to challenge outcomes.","Human reviewers must be given evidence and authority, not a rubber-stamp role."]],["Example decision",["A screening model accelerates hiring but disadvantages an applicant group. The best answer investigates fairness and job relevance before scaling."]]],"trap":"Blindly removing protected attributes does not guarantee removal of proxy discrimination.","question":"Who could be harmed by the model’s false negatives?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Bias and fairness evaluation<\/h3><ul><li>Representative inputs, historical bias, proxy variables and labeling choices can affect outcomes.<\/li><li>Aggregate accuracy may hide poor performance for smaller user segments.<\/li><li>Assess relevant fairness metrics with appropriate legal and domain expertise.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Explainability and contestability<\/h3><ul><li>People affected by material decisions may need intelligible reasons and a way to challenge outcomes.<\/li><li>Human reviewers must be given evidence and authority, not a rubber-stamp role.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Example decision<\/h3><ul><li>A screening model accelerates hiring but disadvantages an applicant group. The best answer investigates fairness and job relevance before scaling.<\/li><\/ul><\/section>"},{"d":3,"title":"Privacy, security and data rights","sub":"Classify the information before choosing the tool","shape":"flow","nodes":["Data inventory","Lawful use","Least privilege","Vendor diligence","Audit"],"blocks":[["Minimum governance requirements",["Establish what personal or confidential information is necessary and the lawful basis for use.","Understand retention, model-training reuse, processing locations, consent obligations and onward transfer.","Use approved services and limit access to job requirements.","Treat retrieved files and tool outputs as untrusted instructions."]],["Third-party diligence",["Review contractual security, confidentiality, availability, audit, deletion and exit commitments.","Verify claims against actual use case, jurisdiction, data flow and applicable obligations."]],["Shared responsibility at strategy level",["The provider secures aspects of the underlying cloud; the customer remains accountable for its data, user access, solution configuration and lawful use as applicable."]]],"trap":"Cloud outsourcing does not outsource legal accountability or data governance.","question":"Does the proposed AI provider train on customer inputs?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Minimum governance requirements<\/h3><ul><li>Establish what personal or confidential information is necessary and the lawful basis for use.<\/li><li>Understand retention, model-training reuse, processing locations, consent obligations and onward transfer.<\/li><li>Use approved services and limit access to job requirements.<\/li><li>Treat retrieved files and tool outputs as untrusted instructions.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Third-party diligence<\/h3><ul><li>Review contractual security, confidentiality, availability, audit, deletion and exit commitments.<\/li><li>Verify claims against actual use case, jurisdiction, data flow and applicable obligations.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Shared responsibility at strategy level<\/h3><ul><li>The provider secures aspects of the underlying cloud; the customer remains accountable for its data, user access, solution configuration and lawful use as applicable.<\/li><\/ul><\/section>"},{"d":3,"title":"Governance operating model","sub":"Who decides; who reviews; who can stop?","shape":"network","nodes":["Board risk appetite","Executive sponsor","AI governance forum","Business owner","Assurance"],"blocks":[["A viable operating model",["Board or executive leadership sets risk appetite and strategic direction.","Business sponsor owns benefits and operational outcomes.","AI governance or risk forum reviews proportional controls and approves exceptions.","Legal, privacy, information security, HR, procurement and technical teams contribute specialist review."]],["Governance artifacts",["Use-case inventory and classification; risk register with owners and treatment actions.","Model or system documentation, evaluation evidence, audit records and incident playbooks.","Approval record, human-override policy, periodic monitoring and sunset/exit criteria."]],["RACI",["Responsible performs, Accountable owns the outcome, Consulted advises, Informed is updated.","For a material decision, make the final accountable owner unambiguous."]]],"trap":"A committee without explicit approval authority or an owner can become a governance bottleneck.","question":"Who signs off the risk before launch?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>A viable operating model<\/h3><ul><li>Board or executive leadership sets risk appetite and strategic direction.<\/li><li>Business sponsor owns benefits and operational outcomes.<\/li><li>AI governance or risk forum reviews proportional controls and approves exceptions.<\/li><li>Legal, privacy, information security, HR, procurement and technical teams contribute specialist review.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Governance artifacts<\/h3><ul><li>Use-case inventory and classification; risk register with owners and treatment actions.<\/li><li>Model or system documentation, evaluation evidence, audit records and incident playbooks.<\/li><li>Approval record, human-override policy, periodic monitoring and sunset/exit criteria.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>RACI<\/h3><ul><li>Responsible performs, Accountable owns the outcome, Consulted advises, Informed is updated.<\/li><li>For a material decision, make the final accountable owner unambiguous.<\/li><\/ul><\/section>"},{"d":3,"title":"Enterprise risk register","sub":"Risk is managed, not wished away","shape":"matrix","nodes":["High impact / high likelihood","High impact / low likelihood","Low impact / high likelihood","Low impact / low likelihood"],"blocks":[["Risk categories",["Privacy leakage or intellectual-property exposure.","Bias, harmful content, misinformation, hallucination and unsafe recommendations.","Security and agent tool misuse; prompt injection; regulatory failure.","Operational drift, vendor outage, supply-chain lock-in and cost overrun."]],["Risk treatment",["Avoid inappropriate uses; reduce exposure using controls and limited scope.","Transfer select financial consequences only where valid; accountability remains.","Accept residual risk only with informed, documented authorization."]],["Risk register fields",["Risk description, likelihood, impact, controls, risk owner, status, trigger thresholds and review date.","Track residual risk after controls, not just an initial inherent-risk label."]]],"trap":"Assuming a platform is “compliant by default” is not an adequate compliance assessment.","question":"What is the residual risk after controls?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Risk categories<\/h3><ul><li>Privacy leakage or intellectual-property exposure.<\/li><li>Bias, harmful content, misinformation, hallucination and unsafe recommendations.<\/li><li>Security and agent tool misuse; prompt injection; regulatory failure.<\/li><li>Operational drift, vendor outage, supply-chain lock-in and cost overrun.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Risk treatment<\/h3><ul><li>Avoid inappropriate uses; reduce exposure using controls and limited scope.<\/li><li>Transfer select financial consequences only where valid; accountability remains.<\/li><li>Accept residual risk only with informed, documented authorization.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Risk register fields<\/h3><ul><li>Risk description, likelihood, impact, controls, risk owner, status, trigger thresholds and review date.<\/li><li>Track residual risk after controls, not just an initial inherent-risk label.<\/li><\/ul><\/section>"},{"d":3,"title":"Prompt injection, guardrails and agents","sub":"Separate trusted authority from untrusted content","shape":"agents","nodes":["User request","Retrieved content","Policy controls","Restricted agent","Logged action"],"blocks":[["Injection mechanism",["A malicious document or page tries to trick an AI system into ignoring authorized instructions.","Higher risk arises when agents have permission to send data, execute purchases or modify records."]],["Layered defences",["Bound tool permissions; authenticate access; treat retrieval as data rather than instructions.","Confirm irreversible actions; apply content constraints and review sensitive outputs.","Test adversarial examples, monitor anomalous operations and provide rollback paths."]],["Human oversight",["Define when AI advises, when it acts autonomously, and when it must request approval.","Make the escalation path visible and usable."]]],"trap":"Telling the model to “ignore malicious prompts” is not a sufficient security architecture.","question":"What is the narrowest useful tool permission?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Injection mechanism<\/h3><ul><li>A malicious document or page tries to trick an AI system into ignoring authorized instructions.<\/li><li>Higher risk arises when agents have permission to send data, execute purchases or modify records.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Layered defences<\/h3><ul><li>Bound tool permissions; authenticate access; treat retrieval as data rather than instructions.<\/li><li>Confirm irreversible actions; apply content constraints and review sensitive outputs.<\/li><li>Test adversarial examples, monitor anomalous operations and provide rollback paths.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Human oversight<\/h3><ul><li>Define when AI advises, when it acts autonomously, and when it must request approval.<\/li><li>Make the escalation path visible and usable.<\/li><\/ul><\/section>"},{"d":3,"title":"Incident response and assurance","sub":"What happens after an AI failure?","shape":"gates","nodes":["Detect","Contain","Investigate","Communicate","Improve"],"blocks":[["Response essentials",["Detect issues using logs, customer reports and measurable alerts.","Contain exposure by pausing a workflow, limiting access or switching to fallback.","Investigate with source, model version, prompt, tool and approval records as appropriate.","Notify required stakeholders and regulators when applicable; correct root causes and retest."]],["Periodic assurance",["Red-team high-risk use cases and reevaluate after changes.","Monitor drift, subgroup performance, content safety, financial cost and human overrides.","Keep vendor and policy reviews current as the business and law evolve."]],["Exam clue",["When harm is already occurring, containment and escalation outrank routine improvement plans."]]],"trap":"An AI incident is not solved by editing a prompt while the harmful agent continues acting.","question":"Who has authority to stop the system immediately?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Response essentials<\/h3><ul><li>Detect issues using logs, customer reports and measurable alerts.<\/li><li>Contain exposure by pausing a workflow, limiting access or switching to fallback.<\/li><li>Investigate with source, model version, prompt, tool and approval records as appropriate.<\/li><li>Notify required stakeholders and regulators when applicable; correct root causes and retest.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Periodic assurance<\/h3><ul><li>Red-team high-risk use cases and reevaluate after changes.<\/li><li>Monitor drift, subgroup performance, content safety, financial cost and human overrides.<\/li><li>Keep vendor and policy reviews current as the business and law evolve.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Exam clue<\/h3><ul><li>When harm is already occurring, containment and escalation outrank routine improvement plans.<\/li><\/ul><\/section>"},{"d":4,"title":"Organizational AI readiness","sub":"A model can work while the business fails","shape":"cycle","nodes":["Business","People","Data","Platform","Security","Operations"],"blocks":[["Six areas of preparedness",["Strategy: business objectives, use-case priorities and funding.","People: skills, employee trust, roles and leadership sponsorship.","Data: quality, definitions, ownership, permissions and discoverability.","Technology: viable solutions, integration and operational support.","Governance: accountability, risk acceptance and compliance.","Operations: monitoring, support, incident response and value tracking."]],["Readiness diagnosis",["Interview stakeholders and rate each dimension using agreed evidence.","Sequence investments so prerequisites are closed before scaling."]],["AWS CAF bridge",["AWS Cloud Adoption Framework presents six perspectives: Business, People, Governance, Platform, Security, Operations.","Use it as a transformation checklist, not as a product deployment wizard."]]],"trap":"The least mature critical dependency can block a seemingly excellent AI business case.","question":"Which missing prerequisite prevents scaling now?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Six areas of preparedness<\/h3><ul><li><strong>Strategy:<\/strong> business objectives, use-case priorities and funding.<\/li><li><strong>People:<\/strong> skills, employee trust, roles and leadership sponsorship.<\/li><li><strong>Data:<\/strong> quality, definitions, ownership, permissions and discoverability.<\/li><li><strong>Technology:<\/strong> viable solutions, integration and operational support.<\/li><li><strong>Governance:<\/strong> accountability, risk acceptance and compliance.<\/li><li><strong>Operations:<\/strong> monitoring, support, incident response and value tracking.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Readiness diagnosis<\/h3><ul><li>Interview stakeholders and rate each dimension using agreed evidence.<\/li><li>Sequence investments so prerequisites are closed before scaling.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>AWS CAF bridge<\/h3><ul><li>AWS Cloud Adoption Framework presents six perspectives: Business, People, Governance, Platform, Security, Operations.<\/li><li>Use it as a transformation checklist, not as a product deployment wizard.<\/li><\/ul><\/section>"},{"d":4,"title":"Leadership and sponsorship","sub":"A programme needs owners, not just champions","shape":"network","nodes":["Executive sponsor","Business owner","Risk owner","Technology lead","Frontline staff"],"blocks":[["Leadership actions",["Set a measurable vision and show how work will change.","Fund cross-functional teams and resolve competing organizational priorities.","Define decision rights, risk tolerance and stage-gate funding."]],["Business ownership",["Assign an owner who is accountable for realized savings, quality or revenue.","Make operational acceptance and benefits ownership continue beyond the pilot."]],["Stakeholder mapping",["Find who gains, loses, performs checks, provides data, signs off, or is affected by errors.","Provide tailored messaging and practical channels for objections and feedback."]]],"trap":"IT delivery ownership is not a substitute for business ownership of outcomes.","question":"Who is accountable if the system works but no value appears?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Leadership actions<\/h3><ul><li>Set a measurable vision and show how work will change.<\/li><li>Fund cross-functional teams and resolve competing organizational priorities.<\/li><li>Define decision rights, risk tolerance and stage-gate funding.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Business ownership<\/h3><ul><li>Assign an owner who is accountable for realized savings, quality or revenue.<\/li><li>Make operational acceptance and benefits ownership continue beyond the pilot.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Stakeholder mapping<\/h3><ul><li>Find who gains, loses, performs checks, provides data, signs off, or is affected by errors.<\/li><li>Provide tailored messaging and practical channels for objections and feedback.<\/li><\/ul><\/section>"},{"d":4,"title":"Workforce and change management","sub":"AI adoption is a people programme","shape":"gates","nodes":["Listen","Design roles","Train","Support","Measure"],"blocks":[["Human-centered transition",["Explain why change is needed and how staff work will be affected.","Co-design workflows with frontline users and representatives.","Offer task-relevant guidance on verification, confidentiality, escalation and limits."]],["Upskill versus reskill",["Upskilling improves competence within a broadly similar job.","Reskilling prepares staff for substantially different duties such as exception handling or AI quality assurance."]],["Adoption measurement",["Track eligible-user adoption and frequency but pair these with outcomes and confidence.","Improve the workflow when employees avoid the tool due to poor utility or trust."]]],"trap":"Mandating logins cannot create real adoption when the workflow makes employees slower.","question":"How will frontline concerns change the rollout design?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Human-centered transition<\/h3><ul><li>Explain why change is needed and how staff work will be affected.<\/li><li>Co-design workflows with frontline users and representatives.<\/li><li>Offer task-relevant guidance on verification, confidentiality, escalation and limits.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Upskill versus reskill<\/h3><ul><li>Upskilling improves competence within a broadly similar job.<\/li><li>Reskilling prepares staff for substantially different duties such as exception handling or AI quality assurance.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Adoption measurement<\/h3><ul><li>Track eligible-user adoption and frequency but pair these with outcomes and confidence.<\/li><li>Improve the workflow when employees avoid the tool due to poor utility or trust.<\/li><\/ul><\/section>"},{"d":4,"title":"Data foundations and integration","sub":"Business value is end-to-end, not inside the demo","shape":"flow","nodes":["Data owners","Quality & access","Workflow integration","AI assistance","Business KPI"],"blocks":[["Data foundations",["Inventory critical sources, define trusted records, assign stewardship and quality standards.","Verify privacy rights, lawful processing, access controls and provenance."]],["Operational integration",["Map the entire human workflow, exceptions, approvals and existing enterprise systems.","Measure end-to-end time including human verification, rework and support.","Plan for fallback when the AI or supplier is unavailable."]],["Strategic technology decisions",["Use managed offerings where appropriate; commission custom work only when value justifies it.","A standalone pilot can hide integration and change costs that become material at enterprise scale."]]],"trap":"Perfectly accurate AI suggestions can add no value if staff must copy them manually into another system.","question":"Which integration gap would remove the projected savings?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Data foundations<\/h3><ul><li>Inventory critical sources, define trusted records, assign stewardship and quality standards.<\/li><li>Verify privacy rights, lawful processing, access controls and provenance.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Operational integration<\/h3><ul><li>Map the entire human workflow, exceptions, approvals and existing enterprise systems.<\/li><li>Measure end-to-end time including human verification, rework and support.<\/li><li>Plan for fallback when the AI or supplier is unavailable.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Strategic technology decisions<\/h3><ul><li>Use managed offerings where appropriate; commission custom work only when value justifies it.<\/li><li>A standalone pilot can hide integration and change costs that become material at enterprise scale.<\/li><\/ul><\/section>"},{"d":4,"title":"Scaling with stage gates","sub":"From isolated success to resilient service","shape":"gates","nodes":["Pilot evidence","Operational readiness","Phased rollout","Value monitoring","Optimize"],"blocks":[["Go/no-go gates",["Business: financial outcomes compared against baseline.","Quality: acceptance and safety results meet thresholds.","Governance: risks, controls, owners and approvals are recorded.","People: affected roles trained, support available and adoption validated."]],["Phased rollout",["Expand by workflow, site or segment; validate variations before more scale.","Keep a fallback and defined incident triggers.","Track KPI and cost trajectories as volumes change."]],["When to stop",["Stop or redesign when unacceptable harm, negative economics or material value gaps persist.","Do not confuse sunk cost with a reason for more spending."]]],"trap":"Scaling can turn minor model error into a systemic business problem.","question":"What would force an immediate rollout pause?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Go/no-go gates<\/h3><ul><li><strong>Business:<\/strong> financial outcomes compared against baseline.<\/li><li><strong>Quality:<\/strong> acceptance and safety results meet thresholds.<\/li><li><strong>Governance:<\/strong> risks, controls, owners and approvals are recorded.<\/li><li><strong>People:<\/strong> affected roles trained, support available and adoption validated.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Phased rollout<\/h3><ul><li>Expand by workflow, site or segment; validate variations before more scale.<\/li><li>Keep a fallback and defined incident triggers.<\/li><li>Track KPI and cost trajectories as volumes change.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>When to stop<\/h3><ul><li>Stop or redesign when unacceptable harm, negative economics or material value gaps persist.<\/li><li>Do not confuse sunk cost with a reason for more spending.<\/li><\/ul><\/section>"},{"d":4,"title":"Value realization and maturity","sub":"Keep accountable measurement after launch","shape":"cycle","nodes":["Target","Measure","Learn","Improve","Reinvest"],"blocks":[["Sustaining outcomes",["Publish baseline, target and verified actual values for every key use case.","Track budget variance, risk outcomes, customer and employee feedback, and incremental adoption.","Attribute benefits carefully and document changes to assumptions."]],["Maturity progression",["Ad hoc: uncoordinated tool use and experiments.","Emerging: repeatable pilots, basic controls and ownership.","Managed: shared standards, portfolio management, and benefits reporting.","Optimizing: measured iteration and repeatable scaling across lines of business."]],["Decision at each review",["Continue, modify, scale, consolidate or retire based on evidence."]]],"trap":"A positive pilot report does not remove the need for post-launch measurement.","question":"What specific evidence would justify a second-year investment?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Sustaining outcomes<\/h3><ul><li>Publish baseline, target and verified actual values for every key use case.<\/li><li>Track budget variance, risk outcomes, customer and employee feedback, and incremental adoption.<\/li><li>Attribute benefits carefully and document changes to assumptions.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Maturity progression<\/h3><ul><li><strong>Ad hoc:<\/strong> uncoordinated tool use and experiments.<\/li><li><strong>Emerging:<\/strong> repeatable pilots, basic controls and ownership.<\/li><li><strong>Managed:<\/strong> shared standards, portfolio management, and benefits reporting.<\/li><li><strong>Optimizing:<\/strong> measured iteration and repeatable scaling across lines of business.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Decision at each review<\/h3><ul><li>Continue, modify, scale, consolidate or retire based on evidence.<\/li><\/ul><\/section>"},{"d":5,"title":"AWS service landscape — business view","sub":"Know strategic purpose, not the console steps","shape":"network","nodes":["Amazon Bedrock","Amazon SageMaker AI","Amazon Quick","AWS CAF","Costs & Marketplace"],"blocks":[["Amazon Bedrock",["Managed access to foundation models and capabilities for generative AI applications.","Relevant strategic concepts include Bedrock Guardrails and Knowledge Bases as building blocks.","Discuss use-case fit, model evaluation, privacy, pricing and ongoing usage."]],["Amazon SageMaker AI",["A managed environment for building and working with custom machine-learning solutions.","Strategic choice when specialized ML is justified versus packaged or foundation-model use."]],["Amazon Quick",["AWS AI-powered workplace and business assistants and intelligence offering.","Discuss business knowledge, collaboration, governed access and end-user outcomes at a high level."]],["Governance and costs",["AWS CAF: transformation planning.","AWS Pricing Calculator: estimate future costs; Cost Explorer: examine spending patterns.","AWS Marketplace: evaluate third-party offerings, procurement and buy/partner pathways."]]],"trap":"The AWS landing page states the certification does not assess detailed AWS services knowledge; the guide still recommends high-level awareness of selected offerings.","question":"Would a built-in solution, foundation-model app or bespoke ML justify this business need?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Amazon Bedrock<\/h3><ul><li>Managed access to foundation models and capabilities for generative AI applications.<\/li><li>Relevant strategic concepts include Bedrock Guardrails and Knowledge Bases as building blocks.<\/li><li>Discuss use-case fit, model evaluation, privacy, pricing and ongoing usage.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Amazon SageMaker AI<\/h3><ul><li>A managed environment for building and working with custom machine-learning solutions.<\/li><li>Strategic choice when specialized ML is justified versus packaged or foundation-model use.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Amazon Quick<\/h3><ul><li>AWS AI-powered workplace and business assistants and intelligence offering.<\/li><li>Discuss business knowledge, collaboration, governed access and end-user outcomes at a high level.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Governance and costs<\/h3><ul><li><strong>AWS CAF:<\/strong> transformation planning.<\/li><li><strong>AWS Pricing Calculator:<\/strong> estimate future costs; Cost Explorer: examine spending patterns.<\/li><li><strong>AWS Marketplace:<\/strong> evaluate third-party offerings, procurement and buy/partner pathways.<\/li><\/ul><\/section>"},{"d":5,"title":"AWS frameworks and strategic controls","sub":"Frameworks are decision aids, not guarantees","shape":"flow","nodes":["AWS CAF","Risk governance","Shared responsibility","Responsible AI lens"],"blocks":[["AWS Cloud Adoption Framework",["Six perspectives: Business, People, Governance, Platform, Security, and Operations.","Useful for organizational readiness, transformation roadmap and capability gap analysis."]],["AWS shared responsibility",["AWS and the customer have different responsibilities; customer obligations vary by service and design.","Customers remain responsible for their data rights, permitted use, end-user access and many configuration choices."]],["Responsible AI Lens",["Use responsible-AI guidance to ask for design reviews, fairness evaluation, safety, privacy, transparency, and monitoring.","No framework by itself certifies a model as safe or compliant."]],["Financial and procurement tools",["Pricing Calculator supports scenario cost estimation; Cost Explorer supports analyzing incurred cost.","Marketplace helps compare third-party sourcing options."]]],"trap":"No certificate or framework removes the obligation to evaluate the actual intended use.","question":"What organizational gap does each perspective reveal?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>AWS Cloud Adoption Framework<\/h3><ul><li><strong>Six perspectives:<\/strong> Business, People, Governance, Platform, Security, and Operations.<\/li><li>Useful for organizational readiness, transformation roadmap and capability gap analysis.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>AWS shared responsibility<\/h3><ul><li>AWS and the customer have different responsibilities; customer obligations vary by service and design.<\/li><li>Customers remain responsible for their data rights, permitted use, end-user access and many configuration choices.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Responsible AI Lens<\/h3><ul><li>Use responsible-AI guidance to ask for design reviews, fairness evaluation, safety, privacy, transparency, and monitoring.<\/li><li>No framework by itself certifies a model as safe or compliant.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Financial and procurement tools<\/h3><ul><li>Pricing Calculator supports scenario cost estimation; Cost Explorer supports analyzing incurred cost.<\/li><li>Marketplace helps compare third-party sourcing options.<\/li><\/ul><\/section>"},{"d":5,"title":"Exam decision patterns","sub":"Keywords reveal the decision that matters","shape":"matrix","nodes":["FIRST / BEFORE","BEST / MOST","RISK / COMPLIANCE","SCALE / ADOPTION"],"blocks":[["Scenario keywords",["FIRST: define the objective, baseline, data suitability, and risk classification before procuring or scaling.","BEST: use explicit requirements to compare viable options and trade-offs.","HIGH STAKES: fairness, oversight, appeal, privacy and accountable approval.","AT SCALE: total cost, integration, governance, staff capabilities and support."]],["Elimination rules",["Reject decisions based only on model size, demo polish, competitor pressure, prompt count or unverified claims.","Reject removing humans from high-consequence decisions without safeguards.","Reject expanding before success thresholds, owners, access rights and support processes exist."]],["The leadership lens",["Ask who is accountable, how value is proven, and what failure costs."]]],"trap":"Not every problem needs AI; the best answer may be process redesign or simpler automation.","question":"Which incorrect answer is tempting, and why?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Scenario keywords<\/h3><ul><li><strong>FIRST:<\/strong> define the objective, baseline, data suitability, and risk classification before procuring or scaling.<\/li><li><strong>BEST:<\/strong> use explicit requirements to compare viable options and trade-offs.<\/li><li><strong>HIGH STAKES:<\/strong> fairness, oversight, appeal, privacy and accountable approval.<\/li><li><strong>AT SCALE:<\/strong> total cost, integration, governance, staff capabilities and support.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Elimination rules<\/h3><ul><li>Reject decisions based only on model size, demo polish, competitor pressure, prompt count or unverified claims.<\/li><li>Reject removing humans from high-consequence decisions without safeguards.<\/li><li>Reject expanding before success thresholds, owners, access rights and support processes exist.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>The leadership lens<\/h3><ul><li>Ask who is accountable, how value is proven, and what failure costs.<\/li><\/ul><\/section>"},{"d":5,"title":"Formula and metric memory wall","sub":"The finance and measurement sheet","shape":"bars","nodes":["ROI","TCO","Payback","Business KPIs"],"blocks":[["Finance formulas",["ROI = (total benefits − total costs) / total costs × 100%; define the period and cost convention.","Payback = initial investment / recurring net saving per period; assumes roughly stable benefits.","NPV = sum of discounted future net benefits − initial outlay.","Unit cost = all attributable costs / successful useful outputs."]],["Operational metrics",["Classification: precision, recall, F1; use segment-specific breakdown where needed.","Regression: mean absolute error in relevant real-world units.","Support: first-contact resolution, customer satisfaction and cost per resolved case.","Adoption: percent of eligible users active in a useful workflow, combined with value KPIs."]],["Interpretation",["Compare estimates to actuals and benchmark against a non-AI baseline.","Add safety, fairness, data-privacy and quality indicators whenever the business context requires them."]]],"trap":"Business improvement is not proven by a rise in the number of AI interactions.","question":"Can you compute ROI and define a nonfinancial guardrail?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Finance formulas<\/h3><ul><li>ROI = (total benefits − total costs) / total costs × 100%; define the period and cost convention.<\/li><li>Payback = initial investment / recurring net saving per period; assumes roughly stable benefits.<\/li><li>NPV = sum of discounted future net benefits − initial outlay.<\/li><li>Unit cost = all attributable costs / successful useful outputs.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Operational metrics<\/h3><ul><li><strong>Classification:<\/strong> precision, recall, F1; use segment-specific breakdown where needed.<\/li><li><strong>Regression:<\/strong> mean absolute error in relevant real-world units.<\/li><li><strong>Support:<\/strong> first-contact resolution, customer satisfaction and cost per resolved case.<\/li><li><strong>Adoption:<\/strong> percent of eligible users active in a useful workflow, combined with value KPIs.<\/li><\/ul><\/section><section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>Interpretation<\/h3><ul><li>Compare estimates to actuals and benchmark against a non-AI baseline.<\/li><li>Add safety, fairness, data-privacy and quality indicators whenever the business context requires them.<\/li><\/ul><\/section>"},{"d":5,"title":"The final 25 decision rules","sub":"Your last-minute revision sheet","shape":"cycle","nodes":["Business fit","Evidence","Safeguards","People","Scale"],"blocks":[["1–9: Problem and value",["Start with the problem; choose AI only when justified.","Prefer a measurable outcome over model novelty.","Establish a baseline and counterfactual.","Compare buy, build and partner using TCO.","Measure unit economics and downstream value.","Model adoption and usage costs at scale.","Apply sensitivity analysis to uncertain forecasts.","Assign an accountable benefits owner.","Use pilot go/no-go criteria before expanding."]],["10–17: Responsible practice",["Classify data sensitivity and decision consequences.","Use lawful, proportionate data processing.","Evaluate fairness across relevant groups.","Provide explainability where the decision demands it.","Make human oversight meaningful.","Restrict agent tool permissions.","Treat retrieved content as untrusted.","Record decisions and rehearse incident response."]],["18–25: Transformation",["Assess AWS CAF six perspectives.","Appoint visible executive sponsorship.","Map frontline stakeholders and workflows.","Upskill or reskill based on future roles.","Integrate AI into real systems and processes.","Monitor quality, value and risk after launch.","Manage vendors, lock-in and exit.","Stop programmes that do not meet business or safety thresholds."]]],"trap":"Good judgment often means saying “not yet” to a promising AI initiative.","question":"Which rule is most often violated by failed AI pilots?","content":"<section class=\"note-card\"><div class=\"note-marker\"><\/div><h3>1–9: Problem and value<\/h3><ul><li>Start with the problem; choose AI only when justified.<\/li><li>Prefer a measurable outcome over model novelty.<\/li><li>Establish a baseline and counterfactual.<\/li><li>Compare buy, build and partner using TCO.<\/li><li>Measure unit economics and downstream value.<\/li><li>Model adoption and usage costs at scale.<\/li><li>Apply sensitivity analysis to uncertain forecasts.<\/li><li>Assign an accountable benefits owner.<\/li><li>Use pilot go/no-go criteria before expanding.<\/li><\/ul><\/section><section class=\"note-card\
