<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT Telephony Site Assessment Form</title>
<style>
:root {
  --navy:#0b2545;
  --blue:#163f73;
  --teal:#0f766e;
  --light:#eef4fa;
  --paper:#ffffff;
  --line:#cfdbea;
  --text:#172435;
  --muted:#5a6c7f;
  --danger:#a63535;
  --success:#1e7b4d;
  --warning:#9a6700;
  --toolbar-height:58px;
  --shadow:0 3px 12px rgba(11,37,69,.07);
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0;
  min-height:100vh;
  font-family:Calibri, Arial, sans-serif;
  color:var(--text);
  background:#e9f0f7;
  line-height:1.35;
}
header {
  background:linear-gradient(120deg,var(--navy),var(--blue));
  color:white;
  padding:28px 32px 22px;
}
header h1 { margin:0 0 6px; font-size:31px; line-height:1.1; }
header p { margin:0; color:#dce8f7; font-size:15px; }
.toolbar {
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  min-height:58px;
  padding:10px 18px;
  background:rgba(255,255,255,.98);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 8px rgba(11,37,69,.10);
}
button, .file-button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:36px;
  border:0;
  border-radius:6px;
  padding:8px 13px;
  font:600 13px Calibri,Arial,sans-serif;
  line-height:1.15;
  cursor:pointer;
  background:var(--navy);
  color:white;
  text-decoration:none;
  white-space:nowrap;
}
button.secondary, .file-button.secondary { background:var(--teal); }
button.light, .file-button.light {
  background:#edf3f9;
  color:var(--navy);
  border:1px solid var(--line);
}
button.danger { background:var(--danger); }
button:hover, .file-button:hover { filter:brightness(1.05); }
button:focus-visible, .file-button:focus-visible,
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline:3px solid rgba(15,118,110,.23);
  outline-offset:1px;
}
.file-button { position:relative; }
.file-button input {
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}
.search {
  flex:1 1 260px;
  min-width:220px;
  min-height:36px;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:6px;
  font:14px Calibri,Arial,sans-serif;
  background:white;
}
.progress-wrap {
  flex:0 1 230px;
  min-width:190px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
}
.progress {
  height:8px;
  flex:1;
  background:#dfe8f2;
  border-radius:999px;
  overflow:hidden;
}
.progress > span {
  display:block;
  height:100%;
  width:0;
  background:var(--teal);
  transition:width .25s ease;
}
.layout {
  display:grid;
  grid-template-columns:270px minmax(0,1fr);
  max-width:1700px;
  margin:0 auto;
}
nav {
  position:sticky;
  top:var(--toolbar-height);
  align-self:start;
  height:calc(100vh - var(--toolbar-height));
  overflow:auto;
  overscroll-behavior:contain;
  background:#f7fafd;
  border-right:1px solid var(--line);
  padding:15px;
}
nav a {
  display:block;
  text-decoration:none;
  color:var(--blue);
  padding:7px 8px;
  border-radius:5px;
  font-size:13px;
  line-height:1.22;
}
nav a:hover, nav a:focus-visible { background:#e6eef7; }
main {
  min-width:0;
  padding:20px;
}
.meta-card, .section-card {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
  overflow:clip;
}
.meta-card { padding:18px; }
.section-card { scroll-margin-top:calc(var(--toolbar-height) + 12px); }
.meta-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
label.field {
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:0;
  font-size:12px;
  font-weight:700;
  color:var(--blue);
}
input, select, textarea {
  width:100%;
  min-width:0;
  border:1px solid #b8c8db;
  border-radius:5px;
  padding:7px 8px;
  font:13px Calibri,Arial,sans-serif;
  line-height:1.25;
  color:var(--text);
  background:white;
}
input, select { min-height:36px; }
textarea {
  min-height:54px;
  resize:vertical;
  overflow:auto;
}
input:focus, select:focus, textarea:focus { border-color:var(--teal); }
.section-head {
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
  padding:16px 18px;
  background:linear-gradient(90deg,#f4f8fc,#ffffff);
  border-bottom:1px solid var(--line);
}
.section-head > div:first-child { min-width:0; }
.section-head h2 {
  margin:0 0 4px;
  color:var(--navy);
  font-size:20px;
  line-height:1.2;
}
.section-head p {
  margin:0;
  color:var(--muted);
  font-size:13px;
}
.section-actions {
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:6px;
  flex:0 0 auto;
}
.section-body {
  padding:0 12px 12px;
  overflow-x:auto;
  overflow-y:visible;
  -webkit-overflow-scrolling:touch;
}
table {
  width:100%;
  min-width:1180px;
  border-collapse:collapse;
  table-layout:fixed;
}
th {
  position:static;
  background:var(--navy);
  color:white;
  text-align:left;
  vertical-align:middle;
  font-size:12px;
  line-height:1.2;
  padding:8px;
  border:1px solid #25466e;
}
td {
  border:1px solid var(--line);
  padding:6px;
  vertical-align:top;
  background:white;
}
tbody tr:nth-child(even) td { background:#f9fbfd; }
tbody tr:hover td { background:#f0f6fb; }
td.item {
  width:20%;
  font-size:12.5px;
  font-weight:700;
  color:var(--blue);
  overflow-wrap:anywhere;
}
td.status { width:13%; }
td.value { width:21%; }
td.notes { width:25%; }
td.owner { width:11%; }
td.date { width:10%; }
td textarea {
  min-height:48px;
  resize:vertical;
}
.status-select[data-state="Confirmed"],
.status-select[data-state="Compliant"] {
  border-color:#68a985;
  background:#edf8f2;
}
.status-select[data-state="Remediation required"],
.status-select[data-state="Rejected"] {
  border-color:#c97878;
  background:#fff0f0;
}
.status-select[data-state="Information required"],
.status-select[data-state="Partially confirmed"] {
  border-color:#caa75d;
  background:#fff9ea;
}
.status-select[data-state="Not applicable"] {
  border-color:#aab6c3;
  background:#f2f4f7;
  color:#596675;
}
.section-summary {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  padding:12px 18px 16px;
  border-top:1px solid var(--line);
  background:#fbfdff;
}
.signoff {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.small { font-size:12px; color:var(--muted); }
.hidden-row { display:none; }
.footer {
  padding:18px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}
.print-only { display:none; }

@media (max-width:1350px) {
  .meta-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .toolbar { padding-inline:12px; }
}
@media (max-width:1100px) {
  .layout { grid-template-columns:1fr; }
  nav { display:none; }
  .meta-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .section-summary { grid-template-columns:1fr; }
}
@media (max-width:700px) {
  header { padding:22px 18px; }
  header h1 { font-size:24px; }
  .toolbar { position:relative; }
  main { padding:10px; }
  .meta-grid, .signoff { grid-template-columns:1fr; }
  .section-head { flex-direction:column; gap:12px; }
  .section-actions { width:100%; justify-content:flex-start; }
  .progress-wrap { flex-basis:100%; }
}

@page { size:A4 landscape; margin:8mm; }

@media print {
  html, body {
    width:auto;
    min-height:0;
    background:white !important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  body { font-size:8.5pt; line-height:1.22; }
  header {
    background:white !important;
    color:var(--navy) !important;
    padding:0 0 5mm;
    border-bottom:2px solid var(--navy);
  }
  header h1 { font-size:20pt; }
  header p { color:var(--muted) !important; font-size:9pt; }
  .toolbar, nav, .section-actions, .no-print { display:none !important; }
  .layout { display:block; max-width:none; }
  main { padding:0; }
  .meta-card, .section-card {
    overflow:visible !important;
    box-shadow:none !important;
    border:1px solid #9eb1c8;
    border-radius:0;
    margin:0 0 5mm;
    break-inside:auto;
    page-break-inside:auto;
  }
  .meta-card { padding:4mm; }
  .section-card {
    break-before:page;
    page-break-before:always;
  }
  #sectionsContainer .section-card:first-child {
    break-before:auto;
    page-break-before:auto;
  }
  main > .meta-card:last-of-type {
    break-before:page;
    page-break-before:always;
  }
  .section-head {
    padding:3mm 4mm;
    background:#eef4fa !important;
    break-after:avoid;
    page-break-after:avoid;
  }
  .section-head h2 { font-size:13pt; }
  .section-head p { font-size:8pt; }
  .section-body {
    padding:0;
    overflow:visible !important;
  }
  table {
    width:100%;
    min-width:0;
    table-layout:fixed;
    font-size:7.2pt;
  }
  thead { display:table-header-group; }
  tfoot { display:table-footer-group; }
  tr {
    break-inside:avoid;
    page-break-inside:avoid;
  }
  th {
    position:static;
    background:#dce7f3 !important;
    color:var(--navy) !important;
    border-color:#9eb1c8;
    font-size:7.2pt;
    padding:2.2mm 1.5mm;
  }
  td {
    padding:1.3mm;
    border-color:#b7c5d5;
    background:white !important;
  }
  tbody tr:nth-child(even) td { background:#f7f9fc !important; }
  td.item { font-size:7.2pt; }
  input, select, textarea {
    min-height:0;
    border:0 !important;
    border-radius:0;
    padding:0;
    font-size:7.2pt;
    line-height:1.18;
    background:transparent !important;
    box-shadow:none !important;
    color:#111 !important;
    appearance:none;
    -webkit-appearance:none;
  }
  textarea {
    display:block;
    width:100%;
    overflow:visible !important;
    resize:none;
    white-space:pre-wrap;
  }
  .section-summary {
    grid-template-columns:repeat(3,minmax(0,1fr));
    padding:3mm 4mm;
    gap:3mm;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  .signoff {
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .footer { display:none; }
  .print-only { display:block; }
}
</style>
</head>
<body>
<header>
  <h1>MT Telephony Site Assessment Form</h1>
  <p>Universal assessment for Cisco, 3CX, Avaya, Microsoft Teams Phone and hotel telephony solutions.</p>
</header>

<div class="toolbar no-print">
  <button type="button" onclick="window.print()">Print / Save as PDF</button>
  <button type="button" class="secondary" id="saveHtmlBtn">Save Filled Form as HTML</button>
  <button type="button" class="light" id="saveLocalBtn">Save in Browser</button>
  <button type="button" class="light" id="loadLocalBtn">Load Browser Save</button>
  <button type="button" class="light" id="exportJsonBtn">Export JSON</button>
  <label class="file-button light">Import JSON<input type="file" id="importJsonInput" accept=".json,application/json"></label>
  <button type="button" class="danger" id="resetBtn">Reset</button>
  <input class="search" id="searchBox" type="search" placeholder="Search assessment items…">
  <div class="progress-wrap">
    <span id="progressText">0% reviewed</span>
    <div class="progress"><span id="progressBar"></span></div>
  </div>
</div>

<div class="layout">
  <nav id="sectionNav" aria-label="Assessment sections"></nav>
  <main>
    <section class="meta-card">
      <h2 style="margin-top:0;color:var(--navy)">Assessment Control Information</h2>
      <div class="meta-grid">
        <label class="field">Customer<input name="meta_customer" type="text"></label>
        <label class="field">Site<input name="meta_site" type="text"></label>
        <label class="field">Site Address<input name="meta_address" type="text"></label>
        <label class="field">Assessment Date<input name="meta_date" type="date"></label>
        <label class="field">Assessor<input name="meta_assessor" type="text"></label>
        <label class="field">Account Manager<input name="meta_account_manager" type="text"></label>
        <label class="field">Customer Technical Contact<input name="meta_customer_contact" type="text"></label>
        <label class="field">Project / Opportunity Reference<input name="meta_project_ref" type="text"></label>
        <label class="field">Proposed Technology
          <select name="meta_technology">
            <option value="">Select</option>
            <option>Cisco</option><option>3CX</option><option>Avaya</option>
            <option>Microsoft Teams Phone</option><option>Hotel Telephony</option>
            <option>Technology to be determined</option>
          </select>
        </label>
        <label class="field">Deployment Model
          <select name="meta_deployment">
            <option value="">Select</option>
            <option>On-premises</option><option>MT-hosted</option><option>Public cloud</option>
            <option>Hybrid</option><option>To be determined</option>
          </select>
        </label>
        <label class="field">Assessment Version<input name="meta_version" type="text" value="1.0"></label>
        <label class="field">Overall Assessment Status
          <select name="meta_status">
            <option>Draft</option><option>In progress</option><option>Pending customer information</option>
            <option>Ready for solution design</option><option>Approved</option>
          </select>
        </label>
      </div>
      <label class="field" style="margin-top:12px">Assessment Scope and Objectives
        <textarea name="meta_scope" placeholder="Describe the site, business objectives, constraints and expected assessment outcome."></textarea>
      </label>
    </section>

    <div id="sectionsContainer"></div>

    <section class="meta-card">
      <h2 style="margin-top:0;color:var(--navy)">Assessment Sign-off</h2>
      <div class="signoff">
        <label class="field">Prepared by<input name="sign_prepared_by" type="text"></label>
        <label class="field">Reviewed by<input name="sign_reviewed_by" type="text"></label>
        <label class="field">Customer representative<input name="sign_customer" type="text"></label>
        <label class="field">Prepared date<input name="sign_prepared_date" type="date"></label>
        <label class="field">Review date<input name="sign_review_date" type="date"></label>
        <label class="field">Customer confirmation date<input name="sign_customer_date" type="date"></label>
      </div>
      <label class="field" style="margin-top:12px">Final Comments / Conditions of Approval
        <textarea name="sign_comments"></textarea>
      </label>
    </section>

    <div class="footer">
      Standalone HTML form. Data remains on the device unless exported or saved into a filled HTML copy.
    </div>
  </main>
</div>

<script id="embedded-state" type="application/json">{}</script>

const STATUS_OPTIONS = ["Not reviewed", "Confirmed", "Partially confirmed", "Information required", "Compliant", "Remediation required", "Not applicable", "Rejected"];
const STORAGE_KEY = "mt-telephony-assessment-v1";

function syncStickyOffsets() {
  const toolbar = document.querySelector('.toolbar');
  const height = toolbar ? Math.ceil(toolbar.getBoundingClientRect().height) : 0;
  document.documentElement.style.setProperty('--toolbar-height', `${height}px`);
}

function autoSizeTextarea(el) {
  if (!el || el.tagName !== 'TEXTAREA') return;
  const minimum = el.closest('td') ? 48 : 54;
  el.style.height = 'auto';
  el.style.height = `${Math.max(minimum, el.scrollHeight + 2)}px`;
}

function autoSizePopulatedTextareas() {
  document.querySelectorAll('textarea').forEach(el => {
    if (el.value) autoSizeTextarea(el);
  });
}

function safeId(value) {
  return value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function optionHtml(selected="") {
  return STATUS_OPTIONS.map(v => `<option value="${v}" ${v===selected ? "selected" : ""}>${v}</option>`).join("");
}

function renderSections() {
  const container = document.getElementById("sectionsContainer");
  const nav = document.getElementById("sectionNav");
  if (container.children.length) return;

  SECTIONS.forEach((section, sIndex) => {
    const card = document.createElement("section");
    card.className = "section-card";
    card.id = section.id;
    card.dataset.generated = "true";

    const rows = section.items.map((item, i) => {
      const key = `${section.id}_${i+1}`;
      return `
      <tr data-search="${item.toLowerCase()}">
        <td class="item">${i+1}. ${item}</td>
        <td class="status">
          <select class="status-select" name="${key}_status" aria-label="${item} status">
            ${optionHtml()}
          </select>
        </td>
        <td class="value"><textarea name="${key}_value" aria-label="${item} confirmed value" placeholder="Confirmed value, quantity, model, setting or requirement"></textarea></td>
        <td class="notes"><textarea name="${key}_notes" aria-label="${item} notes" placeholder="Evidence, finding, dependency, risk or action"></textarea></td>
        <td class="owner"><input name="${key}_owner" type="text" aria-label="${item} owner" placeholder="Owner"></td>
        <td class="date"><input name="${key}_date" type="date" aria-label="${item} target date"></td>
      </tr>`;
    }).join("");

    card.innerHTML = `
      <div class="section-head">
        <div>
          <h2>${section.title}</h2>
          <p>${section.description}</p>
        </div>
        <div class="section-actions no-print">
          <button type="button" class="light" data-action="set-confirmed">Mark all confirmed</button>
          <button type="button" class="light" data-action="clear-section">Clear section</button>
        </div>
      </div>
      <div class="section-body">
        <table>
          <thead>
            <tr>
              <th style="width:20%">Assessment item</th>
              <th style="width:13%">Status</th>
              <th style="width:21%">Confirmed / Input Value</th>
              <th style="width:25%">Evidence, Notes or Required Action</th>
              <th style="width:11%">Owner</th>
              <th style="width:10%">Target Date</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="section-summary">
        <label class="field">Section conclusion
          <textarea name="${section.id}_summary" placeholder="Summarise the confirmed position for this section."></textarea>
        </label>
        <label class="field">Main risks / gaps
          <textarea name="${section.id}_risks" placeholder="List unresolved risks, gaps and dependencies."></textarea>
        </label>
        <label class="field">Recommended action
          <textarea name="${section.id}_action" placeholder="Record the design decision or remediation action."></textarea>
        </label>
      </div>`;
    container.appendChild(card);

    const link = document.createElement("a");
    link.href = `#${section.id}`;
    link.textContent = section.title;
    nav.appendChild(link);
  });
}

function allFields() {
  return [...document.querySelectorAll("input[name], select[name], textarea[name]")];
}

function collectState() {
  const state = {};
  allFields().forEach(el => {
    if (el.type === "checkbox" || el.type === "radio") state[el.name] = el.checked;
    else state[el.name] = el.value;
  });
  return state;
}

function applyState(state) {
  if (!state || typeof state !== "object") return;
  allFields().forEach(el => {
    if (!(el.name in state)) return;
    if (el.type === "checkbox" || el.type === "radio") el.checked = Boolean(state[el.name]);
    else el.value = state[el.name] ?? "";
    if (el.classList.contains("status-select")) el.dataset.state = el.value;
  });
  autoSizePopulatedTextareas();
  updateProgress();
}

function updateStatusStyle(select) {
  select.dataset.state = select.value;
}

function updateProgress() {
  const selects = [...document.querySelectorAll(".status-select")];
  const reviewed = selects.filter(s => s.value !== "Not reviewed").length;
  const pct = selects.length ? Math.round((reviewed / selects.length) * 100) : 0;
  document.getElementById("progressText").textContent = `${pct}% reviewed`;
  document.getElementById("progressBar").style.width = `${pct}%`;
}

function downloadBlob(content, filename, type) {
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function fileBaseName() {
  const customer = document.querySelector('[name="meta_customer"]').value.trim() || "Customer";
  const site = document.querySelector('[name="meta_site"]').value.trim() || "Site";
  const date = document.querySelector('[name="meta_date"]').value || new Date().toISOString().slice(0,10);
  return `${customer}_${site}_Telephony_Assessment_${date}`.replace(/[^a-z0-9_-]+/gi, "_");
}

function persistValuesIntoClone(clone) {
  const current = collectState();
  const cloneFields = [...clone.querySelectorAll("input[name], select[name], textarea[name]")];
  cloneFields.forEach(el => {
    const value = current[el.name] ?? "";
    if (el.tagName === "TEXTAREA") {
      el.textContent = value;
    } else if (el.tagName === "SELECT") {
      [...el.options].forEach(opt => {
        if (opt.value === value) opt.setAttribute("selected", "selected");
        else opt.removeAttribute("selected");
      });
    } else if (el.type === "checkbox" || el.type === "radio") {
      if (value) el.setAttribute("checked", "checked");
      else el.removeAttribute("checked");
    } else {
      el.setAttribute("value", value);
    }
  });
  const stateScript = clone.querySelector("#embedded-state");
  if (stateScript) stateScript.textContent = JSON.stringify(current).replace(/<\/script/gi, "<\\/script");
}

function saveAsHtml() {
  const clone = document.documentElement.cloneNode(true);
  persistValuesIntoClone(clone);
  const html = "<!DOCTYPE html>\n" + clone.outerHTML;
  downloadBlob(html, fileBaseName() + ".html", "text/html;charset=utf-8");
}

function saveLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState()));
  alert("Assessment saved in this browser.");
}

function loadLocal() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) {
    alert("No browser save was found.");
    return;
  }
  applyState(JSON.parse(saved));
}

function exportJson() {
  const payload = {
    form: "MT Telephony Site Assessment",
    version: "1.0",
    exportedAt: new Date().toISOString(),
    data: collectState()
  };
  downloadBlob(JSON.stringify(payload, null, 2), fileBaseName() + ".json", "application/json");
}

function importJson(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      applyState(parsed.data || parsed);
      alert("Assessment data imported.");
    } catch (e) {
      alert("The selected file is not a valid assessment JSON file.");
    }
  };
  reader.readAsText(file);
}

function resetForm() {
  if (!confirm("Clear all entered assessment data? This cannot be undone unless you exported or saved a copy.")) return;
  allFields().forEach(el => {
    if (el.tagName === "SELECT") el.selectedIndex = 0;
    else if (el.type === "date") el.value = "";
    else el.value = "";
    if (el.classList.contains("status-select")) {
      el.value = "Not reviewed";
      updateStatusStyle(el);
    }
  });
  document.querySelector('[name="meta_version"]').value = "1.0";
  updateProgress();
}

function bindEvents() {
  document.addEventListener("input", e => {
    if (e.target.tagName === "TEXTAREA") autoSizeTextarea(e.target);
  });

  document.addEventListener("change", e => {
    if (e.target.classList.contains("status-select")) updateStatusStyle(e.target);
    updateProgress();
  });

  document.getElementById("saveHtmlBtn").addEventListener("click", saveAsHtml);
  document.getElementById("saveLocalBtn").addEventListener("click", saveLocal);
  document.getElementById("loadLocalBtn").addEventListener("click", loadLocal);
  document.getElementById("exportJsonBtn").addEventListener("click", exportJson);
  document.getElementById("resetBtn").addEventListener("click", resetForm);
  document.getElementById("importJsonInput").addEventListener("change", e => {
    if (e.target.files[0]) importJson(e.target.files[0]);
    e.target.value = "";
  });

  document.getElementById("searchBox").addEventListener("input", e => {
    const term = e.target.value.trim().toLowerCase();
    document.querySelectorAll("tbody tr").forEach(row => {
      row.classList.toggle("hidden-row", term && !row.dataset.search.includes(term));
    });
  });

  document.getElementById("sectionsContainer").addEventListener("click", e => {
    const button = e.target.closest("button[data-action]");
    if (!button) return;
    const section = button.closest(".section-card");
    if (button.dataset.action === "set-confirmed") {
      section.querySelectorAll(".status-select").forEach(s => {
        s.value = "Confirmed";
        updateStatusStyle(s);
      });
      updateProgress();
    }
    if (button.dataset.action === "clear-section") {
      if (!confirm("Clear all data in this section?")) return;
      section.querySelectorAll("input[name], select[name], textarea[name]").forEach(el => {
        if (el.classList.contains("status-select")) el.value = "Not reviewed";
        else el.value = "";
        if (el.classList.contains("status-select")) updateStatusStyle(el);
      });
      updateProgress();
    }
  });
}

document.addEventListener("DOMContentLoaded", () => {
  renderSections();
  bindEvents();
  syncStickyOffsets();

  if (window.ResizeObserver) {
    const toolbar = document.querySelector('.toolbar');
    if (toolbar) new ResizeObserver(syncStickyOffsets).observe(toolbar);
  }
  window.addEventListener('resize', syncStickyOffsets);
  window.addEventListener('beforeprint', () => {
    syncStickyOffsets();
    document.querySelectorAll('textarea').forEach(autoSizeTextarea);
  });
  window.addEventListener('afterprint', autoSizePopulatedTextareas);

  document.querySelectorAll(".status-select").forEach(updateStatusStyle);

  try {
    const embedded = JSON.parse(document.getElementById("embedded-state").textContent || "{}");
    if (Object.keys(embedded).length) applyState(embedded);
  } catch (e) {
    console.warn("Embedded form data could not be loaded.", e);
  }

  if (!document.querySelector('[name="meta_date"]').value) {
    document.querySelector('[name="meta_date"]').value = new Date().toISOString().slice(0,10);
  }
  autoSizePopulatedTextareas();
  updateProgress();
});
</script>
</body>
</html>
